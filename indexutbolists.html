function esClasico(rival, fecha) {
  if (!rival || !fecha) return false;

  // fecha viene como "dd/mm/yyyy"
  const partes = fecha.split("/");
  const d = Number(partes[0]);
  const m = Number(partes[1]);
  const y = Number(partes[2]);

  const partidoIndex = y * 12 + m;
  const rivalNorm = rival.toLowerCase();

  return CLASICOS.some(c => {
    const desde = ymToIndex(c.desde);
    const hasta = ymToIndex(c.hasta);

    return (
      rivalNorm.includes(c.club.toLowerCase()) &&
      partidoIndex >= desde &&
      partidoIndex <= hasta
    );
  });
}

// Lista de partidos donde jugó nombreJugador (columna Huracán o Rival)
function partidosDeJugador(nombreJugador, columna = "Huracán") {
  return encuentros.filter(p => {
    const jugadores = (p[columna] || "")
      .replace(/[()]/g, ",")
      .replace(/\b\d+(?:\+\d+)?\s*/g, "")
      .replace(/\.+/g, "")
      .replace(/\by\s+/gi, ",")
      .replace(/\s+e\s+/gi, ",")
      .replace(/,,+/g, ",")
      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1);
    return jugadores.some(j => norm(j) === norm(nombreJugador));
  });
}

// Estima el minuto cuando el dato viene como "PT" o "ST" sin número exacto,
// repartiendo el tiempo restante según cuántas veces se repite el tag sin minuto.
function estimarMinutoPorRepeticion(texto, tag) {
  const regex = new RegExp(`\\b${tag}\\b`, "g");
  const apariciones = (texto.match(regex) || []).length;
  if (apariciones === 0) return null;

  const base = tag === "ST" ? 45 : 0;
  const aprox = Math.ceil(45 / (apariciones + 1));
  return base + aprox;
}

function resolverMinutoEvento(minutoTexto, incidenciasCompletas) {
  if (/^\d+(?:\+\d+)?$/.test(minutoTexto)) return parseMinuto(minutoTexto);
  if (minutoTexto === "PT") return estimarMinutoPorRepeticion(incidenciasCompletas, "PT");
  if (minutoTexto === "ST") return estimarMinutoPorRepeticion(incidenciasCompletas, "ST");
  return null;
}

// --- Goles y penales pateados por el propio jugador ---
function contarGolesYPenales(nombreJugador, partidosDelJugador) {
  const goles = { tiroLibre: 0, cabeza: 0, taquito: 0, rebote: 0, rabona: 0, penal: 0, otros: 0, total: 0 };
  const penalesPateados = { convertidos: 0, atajados: 0, desviados: 0, poste: 0 };

  partidosDelJugador.forEach(p => {
    (p.Incidencias || "").split("</br>").forEach(ev => {
      const t = ev.trim();

      const mGol = t.match(/GOL\s+([^(]+)\(([^)]+)\)/i);
      if (mGol && mGol[2].trim().toUpperCase() === "HUR" &&
          norm(mGol[1]) === norm(nombreJugador)) {
        goles.total++;
        if (/-tiro libre-/i.test(t)) goles.tiroLibre++;
        else if (/-cabezazo-/i.test(t)) goles.cabeza++;
        else if (/-taquito-/i.test(t)) goles.taquito++;
        else if (/-de rebote-/i.test(t)) goles.rebote++;
        else if (/-rabona-/i.test(t)) goles.rabona++;
        else if (/-penal-/i.test(t)) { goles.penal++; penalesPateados.convertidos++; }
        else goles.otros++;
        return;
      }

      const mAta = t.match(/\bATA\s+([^(]+)\(([^)]+)\)/i);
      if (mAta && mAta[2].trim().toUpperCase() === "HUR" &&
          norm(mAta[1]) === norm(nombreJugador)) {
        if (/ataja/i.test(t)) penalesPateados.atajados++;
        return;
      }

      const mDes = t.match(/\bDES\s+([^(]+)\(([^)]+)\)/i);
      if (mDes && mDes[2].trim().toUpperCase() === "HUR" &&
          norm(mDes[1]) === norm(nombreJugador)) {
        penalesPateados.desviados++;
        return;
      }

      const mPos = t.match(/\bPOS\s+([^(]+)\(([^)]+)\)/i);
      if (mPos && mPos[2].trim().toUpperCase() === "HUR" &&
          norm(mPos[1]) === norm(nombreJugador)) {
        penalesPateados.poste++;
      }
    });
  });

  return { goles, penalesPateados };
}

// --- Arqueros de Huracán en un partido dado, y quién atajaba en un minuto puntual ---
function obtenerArquerosDelPartido(partido, listaFutbolistas) {
  const jugadores = (partido.Huracán || "")
    .replace(/[()]/g, ",")
    .replace(/\b\d+(?:\+\d+)?\s*/g, "")
    .replace(/\.+/g, "")
   .replace(/\by\s+/gi, ",")
    .replace(/\s+e\s+/gi, ",")
    .replace(/,,+/g, ",")
    .replace(/\s+,/g, ",")
    .replace(/,\s+/g, ",")
    .replace(/\s+/g, " ")
    .split(/[,;]+/)
    .map(j => j.trim())
    .filter(j => j.length > 1);

  return jugadores.filter(nombre => {
    const datos = listaFutbolistas.find(f => norm(f.futbolista) === norm(nombre));
    return datos && norm(datos.posicion) === "arquero";
  });
}

function arqueroEnMinuto(partido, minuto, listaFutbolistas) {
  if (minuto == null) return null;
  const arqueros = obtenerArquerosDelPartido(partido, listaFutbolistas);
  if (!arqueros.length) return null;

  const texto = partido.Huracán || "";
  const finReal = (partido.Fin2E && partido.Fin2E !== "0")
    ? (parseMinuto(partido.Fin2E) || 120)
    : (parseMinuto(partido.Fin2T) || 90);

  for (const nombre of arqueros) {
    let ingreso = ajustarMinuto(obtenerMinutoIngreso(texto, nombre), partido);
    let salida  = ajustarMinuto(obtenerMinutoSalida(texto, nombre), partido);

    const desde = ingreso !== null ? ingreso : 1;
    const hasta = salida !== null ? salida - 1 : finReal;

    if (minuto >= desde && minuto <= hasta) return nombre;
  }
  return arqueros[0]; // respaldo si algo no calzó
}

// --- Penales en contra (solo para arqueros) ---
function contarPenalesEnContra(nombreArquero, partidosDelArquero, listaFutbolistas) {
  const enContra = { atajados: 0, convertidos: 0, desviados: 0, poste: 0 };

  partidosDelArquero.forEach(p => {
    const incidenciasCompletas = p.Incidencias || "";
    incidenciasCompletas.split("</br>").forEach(ev => {
      const t = ev.trim();

      // ATAJÓ: el nombre del arquero ya viene en el texto
      const mAta = t.match(/\bATA\s+([^(]+)\(([^)]+)\)[^-]*-ataja\s+([^(]+)\(([^)]+)\)-/i);
      if (mAta) {
        const siglaPateador = mAta[2].trim().toUpperCase();
        const siglaGK = mAta[4].trim().toUpperCase();
        if (siglaPateador !== "HUR" && siglaGK === "HUR" &&
            norm(mAta[3]) === norm(nombreArquero)) {
          enContra.atajados++;
        }
        return;
      }

      const mMin = t.match(/^(\d+(?:\+\d+)?|PT|ST)/i);
      if (!mMin) return;
      const minuto = resolverMinutoEvento(mMin[1].toUpperCase(), incidenciasCompletas);
      if (minuto == null) return;

      const mGol = t.match(/GOL\s+([^(]+)\(([^)]+)\)/i);
      if (mGol && mGol[2].trim().toUpperCase() !== "HUR" && /-penal-/i.test(t)) {
        if (arqueroEnMinuto(p, minuto, listaFutbolistas) === nombreArquero) enContra.convertidos++;
        return;
      }

      const mDes = t.match(/\bDES\s+([^(]+)\(([^)]+)\)/i);
      if (mDes && mDes[2].trim().toUpperCase() !== "HUR") {
        if (arqueroEnMinuto(p, minuto, listaFutbolistas) === nombreArquero) enContra.desviados++;
        return;
      }

      const mPos = t.match(/\bPOS\s+([^(]+)\(([^)]+)\)/i);
      if (mPos && mPos[2].trim().toUpperCase() !== "HUR") {
        if (arqueroEnMinuto(p, minuto, listaFutbolistas) === nombreArquero) enContra.poste++;
      }
    });
  });

  return enContra;
}

  return `<div class="golpen-item"><span>${label}</span><b>${valor}</b></div>`;

    cuerpo += itemGolPen("Atajados", penalesPateados.atajados);
    cuerpo += itemGolPen("Desviados", penalesPateados.desviados);
    cuerpo += itemGolPen("En el poste", penalesPateados.poste);
  }

  if (norm(posicion) === "arquero") {
    const enContra = contarPenalesEnContra(nombreJugador, partidosDelJugador, listaFutbolistas);
    const totalEnContra = enContra.atajados + enContra.convertidos +
                           enContra.desviados + enContra.poste;
    if (totalEnContra > 0) {
      cuerpo += `<div class="golpen-titulo">🧤 Penales en contra: ${totalEnContra}</div>`;
      cuerpo += itemGolPen("Atajó", enContra.atajados);
      cuerpo += itemGolPen("Le convirtieron", enContra.convertidos);
      cuerpo += itemGolPen("Le patearon desviado", enContra.desviados);
      cuerpo += itemGolPen("En el poste", enContra.poste);
    }
  }

  if (!cuerpo) return "";
  return `<div class="golpen-box">${cuerpo}</div>`;
}

// --- Frase de historial por AFA / CONMEBOL / Amistosos ---
function calcularResumenCompetencia(nombreJugador, partidos, tipo) {
  let filtrados = [];

  if (tipo === "CONMEBOL") {
    filtrados = partidos.filter(p => esInternacional(p.Torneo));
  } else if (tipo === "AMISTOSO") {
    filtrados = partidos.filter(p => norm(p.Torneo).includes("amistoso"));
  } else { // AFA = todo lo que no sea CONMEBOL ni amistoso
    filtrados = partidos.filter(p => !esInternacional(p.Torneo) && !norm(p.Torneo).includes("amistoso"));
  }

  if (!filtrados.length) return "";

  const A = filtrados.length;

  const años = filtrados
    .map(p => parseInt((p.Fecha || "").split("/").pop()))
    .filter(a => !isNaN(a));
  const B = Math.min(...años);
  const C = Math.max(...años);

  let D = 0, E = 0, F = 0, G = 0, H = 0;

  filtrados.forEach(p => {
    const sit = cap(norm(p.Situación));
    if (sit === "Victoria") D++;
    else if (sit === "Empate") E++;
    else if (sit === "Derrota") F++;

    (p.Incidencias || "").split("</br>").forEach(ev => {
      const t = ev.trim();

      const mGol = t.match(/GOL\s+([^(]+)\(([^)]+)\)/i);
      if (mGol && mGol[2].trim().toUpperCase() === "HUR" && norm(mGol[1]) === norm(nombreJugador)) G++;

      const mExp = t.match(/EXP\s+([^(]+)\(([^)]+)\)/i);
      if (mExp && mExp[2].trim().toUpperCase() === "HUR" && norm(mExp[1]) === norm(nombreJugador)) H++;
    });
  });

  const rangoAnios = (B === C) ? `EN ${B}` : `ENTRE ${B} Y ${C}`;

  let partesResultados = [];
  if (D > 0) partesResultados.push(`GANÓ ${D}`);
  if (E > 0) partesResultados.push(`EMPATÓ ${E}`);
  if (F > 0) partesResultados.push(`PERDIÓ ${F}`);

  let fraseResultados = "";
  if (partesResultados.length === 1) fraseResultados = partesResultados[0] + ".";
  else if (partesResultados.length === 2) fraseResultados = partesResultados.join(" Y ") + ".";
  else if (partesResultados.length === 3) fraseResultados = `${partesResultados[0]}, ${partesResultados[1]} Y ${partesResultados[2]}.`;

  let fraseGolExp = "";
  const partesGolExp = [];
  if (G > 0) partesGolExp.push(`ANOTÓ ${G} ${G === 1 ? "GOL" : "GOLES"}`);
  if (H > 0) partesGolExp.push(`FUE EXPULSADO ${H} ${H === 1 ? "VEZ" : "VECES"}`);
  if (partesGolExp.length) fraseGolExp = partesGolExp.join(" Y ") + ".";

  let texto = "";
  if (tipo === "AFA") {
    texto = `POR AFA JUGÓ ${A} ${A === 1 ? "PARTIDO" : "PARTIDOS"} ${rangoAnios}.`;
  } else if (tipo === "CONMEBOL") {
    texto = `POR CONMEBOL JUGÓ ${A} ${A === 1 ? "PARTIDO" : "PARTIDOS"} ${rangoAnios}.`;
  } else {
    texto = `JUGÓ ${A} ${A === 1 ? "PARTIDO AMISTOSO" : "PARTIDOS AMISTOSOS"} ${rangoAnios}.`;
  }

  return `<p class="resumen-jugador">${texto} ${fraseResultados} ${fraseGolExp}</p>`;
}

// --- Sus compañeros (los 4 que más veces coincidieron) ---
function obtenerCompaneros(nombreJugador, partidosDelJugador, listaFutbolistas, cantidad = 4) {
  const conteo = {};

  partidosDelJugador.forEach(p => {
    const jugadores = (p.Huracán || "")
      .replace(/[()]/g, ",")
      .replace(/\b\d+(?:\+\d+)?\s*/g, "")
      .replace(/\.+/g, "")
     .replace(/\by\s+/gi, ",")
      .replace(/\s+e\s+/gi, ",")
      .replace(/,,+/g, ",")
      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1 && norm(j) !== norm(nombreJugador));

    jugadores.forEach(nombre => {
      const clave = norm(nombre);
      if (!conteo[clave]) conteo[clave] = { nombre, veces: 0 };
      conteo[clave].veces++;
    });
  });

  return Object.values(conteo)
    .sort((a, b) => b.veces - a.veces)
    .slice(0, cantidad)
    .map(c => {
      const datos = listaFutbolistas.find(f => norm(f.futbolista) === norm(c.nombre));
      return { nombre: c.nombre, veces: c.veces, foto: datos ? datos.foto1 : "" };
    });
}

function renderCompaneros(nombreJugador, partidosDelJugador, listaFutbolistas) {
  const companeros = obtenerCompaneros(nombreJugador, partidosDelJugador, listaFutbolistas);
  if (!companeros.length) return "";

  const items = companeros.map(c => `
    <div class="companero-item" onclick="seleccionarFutbolista('${c.nombre.replace(/'/g, "\\'")}')">

        ? `<img src="${c.foto}" alt="${c.nombre}" onerror="this.style.display='none'">`

      <span class="companero-veces">${c.veces} ${c.veces === 1 ? "partido juntos" : "partidos juntos"}</span>

  `).join("");

  return `

      <h3 style="color:#FF0000;">🤝 Sus compañeros</h3>

    </div>
  `;
}

    function limpiarNombreJugador(s) {

    .replace(/\u00A0/g, " ")               // NBSP → espacio
    .replace(/^\s*\(?\d+\)?\s*/, "")       // quita "(48 " o "48)"
    .replace(/[.,;:)\s]+$/, "")            // quita .,;:) al final
    .replace(/^[\s(]+/, "")                // quita espacios o paréntesis al inicio

function obtenerMinutoIngreso(texto, futbolista) {
  const regex = new RegExp(`\\((\\d+(?:\\+\\d+)?)\\s*${futbolista}`, "i");
  const match = texto.match(regex);
  if (!match) return null;

  const m = match[1];
  return m.includes("+")
    ? m.split("+").map(Number).reduce((a,b)=>a+b)
    : Number(m);
}
function obtenerMinutoSalida(texto, futbolista) {

    : Number(m);
}
function getResumenRendimientoFutbolista(nombreFutbolista) {

  const delFutbolista = encuentros.filter(p => {
    const jugadores = (p.Huracán || "")
      .replace(/[()]/g, ",")
      .replace(/\b\d+(?:\+\d+)?\s*/g, "")
      .replace(/\.+/g, "")
     .replace(/\by\s+/gi, ",")
      .replace(/\s+e\s+/gi, ",")
      .replace(/,,+/g, ",")
      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1);

    return jugadores.some(j => norm(j) === norm(nombreFutbolista));
  });

  if (!delFutbolista.length) return "";

  const total = delFutbolista.length;
  const victorias = delFutbolista.filter(p => norm(p.Situación) === "victoria").length;
  const empates   = delFutbolista.filter(p => norm(p.Situación) === "empate").length;
  const derrotas  = delFutbolista.filter(p => norm(p.Situación) === "derrota").length;

  const efectividad = ((victorias * 3 + empates) * 100 / (total * 3)).toFixed(1);

  let color;
  if (efectividad < 30) color = "#e74c3c";
  else if (efectividad < 45) color = "#f1c40f";
  else color = "#2ecc71";

  const fechas = delFutbolista
    .map(p => {
      const [d, m, a] = p.Fecha.split("/");
      return new Date(`${a}-${m}-${d}`);
    })
    .sort((a,b) => a - b);

  const desde = fechas[0].getFullYear();
  const hasta = fechas[fechas.length - 1].getFullYear();

  return `
    <div style="margin-bottom:10px;">
    <!-- <div>${total} ${total === 1 ? "partido" : "partidos"} (${desde}-${hasta})</div> -->
      <div>
        <span style="
          background:${color};
          color:white;
          padding:4px 8px;
          border-radius:6px;
          font-weight:bold;
          font-size:15px;
        ">
          ${efectividad}%</span>
        <span>de efectividad</span>
      </div>
    </div>
  `;
}
function renderEstadisticas(nombreFutbolista, lado = "Huracan") {
  const columna = lado === "Huracan" ? "Huracán" : "Rival";

  const delFutbolista = encuentros.filter(p => {
    const jugadores = (p[columna] || "")
      .replace(/[()]/g, ",")
      .replace(/\b\d+(?:\+\d+)?\s*/g, "")
      .replace(/\.+/g, "")
     .replace(/\by\s+/gi, ",")
      .replace(/\s+e\s+/gi, ",")
      .replace(/,,+/g, ",")
      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1);
    return jugadores.some(j => norm(j) === norm(nombreFutbolista));
  });

  if (!delFutbolista.length) {
    return lado === "Rival" 
      ? "<p style='font-style:italic; color:#666; text-align:center;'>No registra partidos enfrentando a Huracán.</p>" 
      : "<p style='font-style:italic; color:#666; text-align:center;'>Sin datos disponibles en Huracán.</p>";
  }

  // =========================================================
  // CASO A: EN LADOS DE RIVAL (Agrupación por Período de Años)
  // =========================================================
  if (lado === "Rival") {
    // 1. Obtener años de los partidos
    const anios = delFutbolista
      .map(p => {
        const partes = (p.Fecha || "").split("/");
        return partes.length === 3 ? parseInt(partes[2], 10) : null;
      })
      .filter(a => a && !isNaN(a))
      .sort((a, b) => a - b);

    let rangoAnios = "";
    if (anios.length === 1) {
      rangoAnios = `${anios[0]}`;
    } else if (anios.length > 1) {
      const minAnio = anios[0];
      const maxAnio = anios[anios.length - 1];
      rangoAnios = minAnio === maxAnio ? `${minAnio}` : `${minAnio}-${maxAnio}`;
    } else {
      rangoAnios = "Enfrentamientos";
    }

    // 2. Contar Victorias, Empates, Derrotas y Goles generales frente a Huracán
    let v = 0, eCount = 0, d = 0, golesTotal = 0;
    for (const p of delFutbolista) {
    const sit = cap(norm(p.Situación));
      if (sit === "Victoria") d++;
      else if (sit === "Empate") eCount++;
      else if (sit === "Derrota") v++;

      const textoIncidencias = norm(p.Incidencias || "");
      const patron = new RegExp(`gol\\s+${norm(nombreFutbolista)}`, "g");
      golesTotal += (textoIncidencias.match(patron) || []).length;
    }

    const totalPartidos = delFutbolista.length;
    const resumen = `G${v}-E${eCount}-P${d}`;

    return `
      <div class="stat-group">
        <div class="stat-title">🗓️ Período: ${rangoAnios}</div>
        <ul>
          <li>
            <label>
              <input type="checkbox" class="chkPartidos"
                data-comp="TODOS"
                data-sit="todos"
                data-lado="Rival"
                data-futbolista="${nombreFutbolista}">
              📊 ${totalPartidos} ${totalPartidos === 1 ? "partido" : "partidos"} (${resumen}) – ⚽ ${golesTotal} ${golesTotal === 1 ? "gol" : "goles"}
            </label>
            <div class="partidos-lista" style="display:none; margin-left:20px;"></div>
          </li>
        </ul>
      </div>
    `;
  }

  // =========================================================
  // CASO B: EN HURACÁN (Se mantiene la agrupación por Torneo)
  // =========================================================
  const agg = {};
  for (const e of delFutbolista) {
    const comp = bucketCompetencia(e.Torneo);
    const sit = cap(norm(e.Situación));
    if (!agg[comp]) agg[comp] = { Victoria: 0, Empate: 0, Derrota: 0, Goles: 0 };
    if (SITUACIONES.includes(sit)) {
      agg[comp][sit] += 1;
    }

    const textoIncidencias = norm(e.Incidencias || "");
    const patron = new RegExp(`gol\\s+${norm(nombreFutbolista)}`, "g");
    agg[comp].Goles += (textoIncidencias.match(patron) || []).length;
  }

  let html = "";
  for (const comp of ORDEN_COMPETENCIAS) {
    if (!agg[comp]) continue;
    const bucket = agg[comp];
    const total = bucket.Victoria + bucket.Empate + bucket.Derrota;
    if (total === 0) continue;

    const resumen = `G${bucket.Victoria}-E${bucket.Empate}-P${bucket.Derrota}`;
    const goles = bucket.Goles || 0;

    html += `
      <div class="stat-group">
        <div class="stat-title">🏆 ${comp}</div>
        <ul>
          <li>
            <label>
              <input type="checkbox" class="chkPartidos"
                data-comp="${comp}"
                data-sit="todos"
                data-lado="Huracan"
                data-futbolista="${nombreFutbolista}">
              📊 ${total} ${total === 1 ? "partido" : "partidos"} (${resumen}) – ⚽ ${goles} ${goles === 1 ? "gol" : "goles"}
            </label>
            <div class="partidos-lista" style="display:none; margin-left:20px;"></div>
          </li>
        </ul>
      </div>
    `;
  }

  return html;
}

      .replace(/\b\d+(?:\+\d+)?\s*/g, "")

      .replace(/\s+e\s+/gi, ",")

      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1);
    return jugadores.some(j => norm(j) === norm(nombreFutbolista));
  });

  if (!delFutbolista.length) {
    return {
      resumen: "",
      debut: "Sin registros",
      despedida: "Sin registros"
    };
  }

  // ✅ Total de partidos
  const total = delFutbolista.length;

  // ✅ Total de goles en Huracán
  const totalGoles = encuentros.reduce((acc, p) => {
    const texto = norm(p.Incidencias || "");
    const patron = new RegExp(`gol\\s+${norm(nombreFutbolista)}\\s*\\(hur\\)`, "g");
    const coincidencias = texto.match(patron);
    return acc + (coincidencias ? coincidencias.length : 0);
  }, 0);

  // ✅ Ordenamos los partidos cronológicamente UNA SOLA VEZ
  delFutbolista.sort((a, b) => {
    const [dA, mA, aA] = (a.Fecha || "").split("/");
    const [dB, mB, aB] = (b.Fecha || "").split("/");
    return new Date(`${aA}-${mA}-${dA}`) - new Date(`${aB}-${mB}-${dB}`);
  });

  // Primer y último partido
  const primerPartido = delFutbolista[0];
  const ultimoPartido = delFutbolista[delFutbolista.length - 1];

  // Helper para darle formato al partido
  const formatear = (p) => {
    const res = `${p.Resultado1 || 0}-${p.Resultado2 || 0}`;
    const rival = p.Club || "Rival";
    const torneo = p.Torneo || "";
    const dt = p.Técnico ? ` (DT: ${p.Técnico})` : "";
    return `${p.Fecha}, ${res} vs. ${rival} - ${torneo}${dt}`;
  };

  const primerAnio = (primerPartido.Fecha || "").split("/")[2] || "";
  const ultimoAnio = (ultimoPartido.Fecha || "").split("/")[2] || "";

  return {
    resumen: `${total} ${total === 1 ? "partido" : "partidos"} – ${totalGoles} ${totalGoles === 1 ? "gol" : "goles"} (${primerAnio}-${ultimoAnio})`,
    debut: formatear(primerPartido),
    despedida: formatear(ultimoPartido)
  };
}

function enlazarJugadores(texto) {
  if (!texto) return "";
  
  // Separamos por comas, punto y coma, paréntesis, puntos y conjunciones "y" / "e"
  const partes = texto.split(/(\s*[,;().]+\s*(?!\b[ye]\b\s)|\s+\b[ye]\b\s+)/i);
  
  return partes.map(part => {
    // Si la parte es un separador o signo de puntuación, la devolvemos tal cual
    if (/^(\s*[,;().]+\s*|\s+\b[ye]\b\s+)$/i.test(part)) {
      return part;
    }

    const original = part.trim();
    if (!original) return part;

    // Si hay un minuto de cambio al inicio (ej: "67 ", "67' ", "45+2 "), lo extraemos
    const matchMinuto = original.match(/^(\d+(?:\+\d+)?'?\s*)(.*)/);
    let prefijoMinuto = "";
    let candidatoNombre = original;

    if (matchMinuto) {
      prefijoMinuto = matchMinuto[1];
      candidatoNombre = matchMinuto[2];
    }

    const nombreLimpio = candidatoNombre.trim();
    if (!nombreLimpio) return part;

    // Verificamos si el futbolista existe en el listado cargado (array 'futbolistas')
    const existeEnBase = typeof futbolistas !== "undefined" && 
      futbolistas.some(f => norm(f.futbolista) === norm(nombreLimpio));

    // Si existe, armamos el enlace en rojo, dejando el número del minuto afuera del link
    if (existeEnBase) {
      const url = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(nombreLimpio)}`;
      const linkHTML = `<a href="${url}" ` +
                       `style="color: #d40000; text-decoration: none; font-weight: normal;" ` +
                       `onmouseover="this.style.fontWeight='bold'" ` +
                       `onmouseout="this.style.fontWeight='normal'">${candidatoNombre}</a>`;
      return prefijoMinuto + linkHTML;
    }

    // Si no está en la base, queda como texto plano
    return part;
  }).join("");
}

  function InvertirNombre(nombre) {
  const partes = nombre.trim().split(" ");
  if (partes.length < 2) return nombre;

  if (partes.length === 2) {
    // Caso simple: Nombre + Apellido
    const [nombre1, apellido] = partes;
    return apellido + ", " + nombre1;
  }

  // Lista de conectores/apellidos compuestos en minúscula
  const conectores = ["de", "del", "de la", "de los", "la", "las", "los", "san", "santa"];

  // Unir las últimas palabras y ver si forman parte de un apellido compuesto
  let i = partes.length - 1;
  let apellido = partes[i];
  while (i > 0) {
    const posible = partes[i - 1].toLowerCase();
    if (conectores.includes(posible)) {
      apellido = partes[i - 1] + " " + apellido;
      i--;
    } else {
      break;
    }
  }

  const nombres = partes.slice(0, i).join(" ");
  return apellido + ", " + nombres;
}

function debounce(func, delay) {
  return function(...args) {

function filtrarFutbolistas(termino) {
  const termNorm = norm(termino);
  suggestionsList.innerHTML = "";
  selectedIndex = -1;

  if (!termNorm) return;

  // Un jugador puede tener más de una fila en el CSV (si volvió al club más
  // de una vez, con Procedencia/Destino distintos por etapa) — acá solo nos
  // interesa mostrarlo UNA vez en la lista, quedándonos con la primera fila
  // que aparezca para ese nombre.
  const vistos = new Set();
  const resultados = [];
  for (const a of futbolistas) {
    if (!norm(a.futbolista).includes(termNorm)) continue;
    const clave = norm(a.futbolista);
    if (vistos.has(clave)) continue;
    vistos.add(clave);
    resultados.push(a);
    if (resultados.length >= 15) break;
  }

  resultados.forEach(r => {
    const li = document.createElement("li");
    li.className = "autocomplete-item";

    li.innerHTML = `

        ? `<img src="${r.foto1}" onerror="this.style.display='none'">`

      <span>${r.futbolista}</span>

    li.addEventListener("click", () => {
      seleccionarFutbolista(r.futbolista);
    });

    suggestionsList.appendChild(li);
  });
}

    searchInput.addEventListener("keydown", function(e) {
  const items = suggestionsList.querySelectorAll("li");

  if (e.key === "Escape") {
    suggestionsList.innerHTML = "";
    selectedIndex = -1;
    searchInput.blur();
    return;
  }

  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    selectedIndex = (selectedIndex + 1) % items.length;
    actualizarSeleccion(items);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
    actualizarSeleccion(items);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (selectedIndex >= 0 && selectedIndex < items.length) {
      items[selectedIndex].click();
    }
  } else {
    selectedIndex = -1; // Reset si escribe otra tecla
  }
});

    function actualizarSeleccion(items) {
  items.forEach((item, i) => {
    const activo = i === selectedIndex;
    item.style.background = activo ? "#ffdddd" : "white";
    if (activo) {
      // 👉 Mostrar texto completo en el input (typeahead visual)
      const texto = item.textContent.trim();
      searchInput.value = texto;
    }
  });

  // desplazamiento automático si el ítem está fuera de vista
  const selectedItem = items[selectedIndex];
  if (selectedItem) {
    const containerTop = suggestionsList.scrollTop;
    const containerBottom = containerTop + suggestionsList.offsetHeight;
    const itemTop = selectedItem.offsetTop;
    const itemBottom = itemTop + selectedItem.offsetHeight;
    if (itemTop < containerTop) {
      suggestionsList.scrollTop = itemTop;
    } else if (itemBottom > containerBottom) {
      suggestionsList.scrollTop = itemBottom - suggestionsList.offsetHeight;
    }
  }
}

function ajustarMinuto(minuto, p) {
  if (minuto == null) return null;

  let m = minuto;

  if (typeof m === "string" && m.includes("+")) {
    m = m.split("+").map(Number).reduce((a,b)=>a+b);
  } else {
    m = Number(m);
  }

  const finPT = Number(p.FinPT) || 45;

  // 👉 si es ST (tu convención: >= 46)
  if (m >= 46) {
    return m + (finPT - 45);
  }

  return m;
}

  }

  return Number(minutoStr);
}

    // y disparamos la función que ya tenés armada
    setTimeout(() => {
      seleccionarFutbolista(nombreJugador);
    }, 500); 
  }
});
  </script>

  <script>
  // --- Aviso al padre (Blogger) de la altura real del contenido ---
  // Mismo mecanismo que ya usa indexivals.html (Rivales), que sabemos que funciona:
  // MutationObserver + resize + imágenes + un reenvío corto de respaldo.
  function enviarAltura() {
    const altura = document.documentElement.scrollHeight || document.body.scrollHeight;
    parent.postMessage({ type: 'ajustarAltura', altura: altura }, '*');
  }

  // Envío inicial y en resize
  window.addEventListener('load', enviarAltura);
  window.addEventListener('resize', enviarAltura);

  // Detecta cambios dinámicos en el DOM (buscador, resultados, acordeones)
  const moFutbolistas = new MutationObserver(() => enviarAltura());
  moFutbolistas.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });

  // Recalcula cuando terminan de cargar las imágenes (fotos, escudos)
  document.querySelectorAll('img').forEach(img => {
    if (!img.complete) img.addEventListener('load', enviarAltura);
  });

  // Reenvío periódico corto como red de seguridad (transiciones CSS del acordeón, etc.)
  let contadorAltura = 0;
  const fallbackAltura = setInterval(() => {
    enviarAltura();
    if (++contadorAltura > 10) clearInterval(fallbackAltura);
  }, 500);
  </script>
