  #filtroPosiciones input:checked + span,

<script>
let rankingActual = [];
let rankingBase = [];
let ordenActual = { campo: "globopedia", asc: true };
let filtroTorneo = "TODOS";

// 🏆 DICCIONARIO DE PUNTOS POR EQUIPO
const puntosEquipos = {
  "Real Madrid (España)": 10,
  "Bayern Munich (Alemania)": 5, "Milan (Italia)": 5,
  "Barcelona (España)": 4, "Boca Juniors": 3, "Internazionale (Italia)": 4, "Nacional (Uruguay)": 3, "Peñarol (Uruguay)": 3, "Sao Paulo (Brasil)": 3,
  "Ajax (Holanda)": 3, "Chelsea (Inglaterra)": 3, "Corinthians (Brasil)": 2, "Independiente": 2, "Juventus (Italia)": 3, "Manchester United (Inglaterra)": 3, "Porto (Portugal)": 3, "Santos (Brasil)": 2,
  "Atl. Madrid (España)": 2, "Borussia Dortmund (Alemania)": 2, "Crvena Zvezda (Serbia)": 2, "Estudiantes (La Plata)": 1, "Feyenoord (Holanda)": 2, "Flamengo RJ (Brasil)": 1, "Gremio (Brasil)": 1, "Internacional RS (Brasil)": 1, "Liverpool (Inglaterra)": 2, "Manchester City (Inglaterra)": 2, "Olimpia (Paraguay)": 1, "Paris Saint Germain (Francia)": 2, "Racing Club": 1, "River Plate": 1, "Vélez Sársfield": 1,
  "Borussia Monchegladbach (Alemania)": 1, "Eintracht Frankfurt (Alemania)": 1, "Hamburgo (Alemania)": 1, "Werder Bremen (Alemania)": 1, "Stuttgart (Alemania)": 1, "Athletic (España)": 1, "Sevilla (España)": 1, "Valencia (España)": 1, "PSV Eindhoven (Holanda)": 1, "Twente (Holanda)": 1, "Bologna (Italia)": 1, "Fiorentina (Italia)": 1, "Lazio (Italia)": 1, "Napoli (Italia)": 1, "Roma (Italia)": 1, "Torino (Italia)": 1, "Aston Villa (Inglaterra)": 1, "Arsenal (Inglaterra)": 1, "Everton (Inglaterra)": 1, "Newcastle United (Inglaterra)": 1, "Tottenham Hotspur (Inglaterra)": 1, "Sunderland (Inglaterra)": 1, "Bordeaux (Francia)": 1, "Lille (Francia)": 1, "Mónaco (Francia)": 1, "Olympique Lyon (Francia)": 1, "Olympique Marsella (Francia)": 1, "Saint Étienne (Francia)": 1, "Sporting Lisboa (Portugal)": 1, "Vitória Guimaraes (Portugal)": 1, "Sporting Braga (Portugal)": 1, "Boavista (Portugal)": 1, "Belenenses (Portugal)": 1, "Partizan (Serbia)": 1, "Vojvodina (Serbia)": 1, "Omladinski (Serbia)": 1
};

const URL_BASE_ESCUDOS = "https://globopedia.github.io/Artids/escudos/";

function obtenerListaClubes(textoTrayectoria) {
  if (!textoTrayectoria || textoTrayectoria === 'Trayectoria' || textoTrayectoria === '-') return [];
  
  return textoTrayectoria
    .split(',')
    .map(club => club.trim())
    .filter(club => club !== '' && puntosEquipos.hasOwnProperty(club)); // 👈 Solo deja los clubes que suman puntos
}

function generarHTMLTrayectoria(textoTrayectoria) {
  const clubes = obtenerListaClubes(textoTrayectoria);
  if (clubes.length === 0) return '-';

  return `<div class="celda-escudos">` + 
    clubes.map(club => {
      const urlEscudo = `${URL_BASE_ESCUDOS}${encodeURIComponent(club)}.png`;
      return `<img src="${urlEscudo}" alt="${club}" title="${club}" class="escudo-img">`;
    }).join('') + 
  `</div>`;
}

function calcularPuntajeJugador(textoTrayectoria) {
  const clubes = obtenerListaClubes(textoTrayectoria);
  return clubes.reduce((total, club) => {
    return total + (puntosEquipos[club] || 0);
  }, 0);
}

const CONFIG_ESTADISTICAS = {
  globopedia: {titulo: "HALL GLOBOPEDIA", campo: "Globopedia", formato: r => r.globopedia},
  populares: {titulo: "LOS MÁS POPULARES", campo: "Trayectoria", formato: r => generarHTMLTrayectoria(r.trayectoriaTexto)},
  partidos: {titulo: "MÁS PARTIDOS JUGADOS", campo: "Partidos", formato: r => r.partidos},
  duco: {titulo: "MÁS PARTIDOS EN EL DUCÓ", campo: "Partidos", formato: r => r.duco},
  goles: {titulo: "MÁXIMOS GOLEADORES", campo: "Goles", formato: r => r.goles},
  expulsiones: {titulo: "MÁS EXPULSIONES", campo: "Expulsiones", formato: r => r.expulsiones},
  vallasInvictas: {titulo: "MÁS VALLAS INVICTAS", campo: "Partidos Invicto", formato: r => r.vallasInvictas},
  efectividad: {titulo: "EFECTIVIDAD DE PUNTOS (+20 PARTIDOS)", campo: "Efectividad", formato: r => r.efectividad + "%"},
  minutos: {titulo: "MÁS MINUTOS JUGADOS", campo: "Minutos", formato: r => r.minutos.toLocaleString("es-AR")},
  inactividad: {titulo: "MÁS TIEMPO SIN JUGAR", campo: "Tiempo", formato: r => r.inactividadTexto},
  rachaSinGoles: {titulo: "MÁS MINUTOS SIN GOLES EN CONTRA", campo: "Minutos", formato: r => r.rachaTexto},
  rachaGoles: {titulo: "MÁS PARTIDOS SEGUIDOS HACIENDO GOLES", campo: "Partidos", formato: r => `${r.partidos} (${r.goles} goles)`},
  pataduras: {titulo: "LOS QUE NO RINDIERON", campo: "Globopedia", formato: r => r.globopedia.toFixed(1)}
};

function clasificarTorneo(torneo) {
  if (!torneo) return "OTRO";
  const t = torneo.toLowerCase();
  if (t.includes("libertadores")) return "LIBERTADORES";
  if (t.includes("sudamericana")) return "SUDAMERICANA";
  if (t.includes("conmebol")) return "CONMEBOL";
  if (t.includes("copa argentina")) return "COPA ARGENTINA";
  if (t.includes("béccar varela")) return "BÉCCAR VARELA";
  if (t.includes("copa de honor")) return "COPA DE HONOR";
  if (t.includes("estímulo 1920")) return "ESTÍMULO 1920";
  if (t.includes("estímulo 1926")) return "ESTÍMULO 1926";
  if (t.includes("copa centenario")) return "COPA CENTENARIO";
  if (t.includes("maradona")) return "COPA MARADONA";
  if (t.includes("supercopa")) return "SUPERCOPA";
  if (t.includes("escobar")) return "COPA ESCOBAR";
  if (t.includes("amistoso")) return "AMISTOSO";
  if (t.includes("nacional b") || t.includes("b nacional") || t.includes("bn") || t.includes("nb") || t.includes("reducido")) return "B NACIONAL";
  if (t.includes("competencia")) return "COPA COMPETENCIA";
  if (t.includes("superliga")) return "COPA SUPERLIGA";
  if (t.includes("campeonato") || t.includes("torneo de honor")) return "CAMPEONATO";
  return "OTRO";
}

function aplicarFiltros() {
  let partidos = [...datosArtids1910, ...datosArtids1925, ...datosArtids1940, ...datosArtids1955, ...datosArtids1970, ...datosArtids1985, ...datosArtids2000, ...datosArtids2015];

  const desde = document.getElementById("fechaDesde").value;
  const hasta = document.getElementById("fechaHasta").value;
  const fechaDesde = desde ? new Date(desde) : null;
  const fechaHasta = hasta ? new Date(hasta) : null;

  if (fechaDesde) partidos = partidos.filter(p => convertirFecha(p.Fecha) >= fechaDesde);
  if (fechaHasta) partidos = partidos.filter(p => convertirFecha(p.Fecha) <= fechaHasta);
  if (filtroTorneo !== "TODOS") partidos = partidos.filter(p => clasificarTorneo(p.Torneo) === filtroTorneo);

  let ranking = generarRanking(partidos);

  if (ordenActual.campo === "efectividad") ranking = ranking.filter(j => j.partidos > 20);

  const soloExtranjeros = document.getElementById("soloExtranjeros").checked;
  if (soloExtranjeros) ranking = ranking.filter(j => esExtranjero(j.nombre));

  const soloInferiores = document.getElementById("soloInferiores").checked;
  if (soloInferiores) ranking = ranking.filter(j => esDeInferiores(j.nombre));

  if (ordenActual.campo === "pataduras") {
    ranking.sort((a, b) => a.globopedia - b.globopedia);
  } else if (ordenActual.campo === "populares") {
    ranking.sort((a, b) => b.puntajeTrayectoria - a.puntajeTrayectoria);
  } else {
    ranking.sort((a, b) => b[ordenActual.campo] - a[ordenActual.campo]);
  }

  rankingBase = ranking;
  aplicarFiltrosLivianos();
}

function aplicarFiltrosLivianos() {
  let ranking = [...rankingBase];

  const posicionesActivas = Array.from(
    document.querySelectorAll('#filtroPosiciones input:checked')
  ).map(c => c.value);

  ranking = ranking.filter(j => posicionesActivas.includes(j.posicion));
  
  if (document.getElementById("soloExtranjeros").checked) ranking = ranking.filter(j => esExtranjero(j.nombre));
  if (document.getElementById("soloInferiores").checked) ranking = ranking.filter(j => esDeInferiores(j.nombre));

  if (ordenActual.campo === "pataduras") {
    ranking.sort((a, b) => a.globopedia - b.globopedia);
  } else if (ordenActual.campo === "populares") {
    ranking.sort((a, b) => b.puntajeTrayectoria - a.puntajeTrayectoria);
  } else {
    ranking.sort((a, b) => b[ordenActual.campo] - a[ordenActual.campo]);
  }

  rankingActual = ranking;
  renderRanking(rankingActual);
}

function norm(t) {
  return (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function formatearApellidoPrimero(nombreCompleto) {
  const partes = nombreCompleto.trim().split(/\s+/);
  if (partes.length === 2) return `${partes[1]}, ${partes[0]}`;
  if (partes.length === 3) {
    if (partes[1].length === 1) return `${partes[2]}, ${partes[0]} ${partes[1]}`;
    return `${partes[1]} ${partes[2]}, ${partes[0]}`;
  }
  const nombre = partes[0];
  const apellido = partes.slice(1).join(" ");
  return `${apellido}, ${nombre}`;
}

function obtenerMinutoIngreso(texto, nombre) {
  const nombreNorm = nombre.toLowerCase();
  const regex = /\((\d+(?:\+\d+)?)\s+([^)]+)\)/g;
  let match;
  while ((match = regex.exec(texto)) !== null) {
    let minuto = match[1];
    let bloque = match[2].toLowerCase();
    const jugadores = bloque.split(/y|,/).map(j => j.trim());
    if (jugadores.includes(nombreNorm)) {
      if (minuto.includes("+")) return minuto.split("+").map(Number).reduce((a,b)=>a+b);
      return Number(minuto);
    }
  }
  return null;
}

function obtenerMinutoSalida(texto, futbolista) {
  const regex = new RegExp(`${futbolista}\\s*\\(\\s*(\\d+(?:\\+\\d+)?)\\s+[^()]+`, "i");
  const match = texto.match(regex);
  if (!match) return null;
  const m = match[1];
  return m.includes("+") ? m.split("+").map(Number).reduce((a,b)=>a+b) : Number(m);
}

function obtenerMinutoSalidaForzada(incidencias, nombre) {
  if (!incidencias) return null;
  const regex = new RegExp(`(\\d+(?:\\+\\d+)?)\\s+(EXP|LES)\\s+${nombre}`, "i");
  const match = incidencias.match(regex);
  if (!match) return null;
  const m = match[1];
  return m.includes("+") ? m.split("+").map(Number).reduce((a,b)=>a+b) : Number(m);
}

function obtenerMinutosGolesRival(incidencias) {
  if (!incidencias) return [];
  const limpio = incidencias.replace(/<[^>]+>/g, " ").toUpperCase();
  const regex = /(\d+(?:\+\d+)?)\s+GOL\s+([^()]+)\(([^)]+)\)/g;
  const minutos = [];
  let match;
  while ((match = regex.exec(limpio)) !== null) {
    const minutoTxt = match[1];
    const equipo = match[3];
    if (equipo.includes("HUR")) continue;
    const minuto = minutoTxt.includes("+") ? minutoTxt.split("+").map(Number).reduce((a,b)=>a+b) : Number(minutoTxt);
    minutos.push(minuto);
  }
  return minutos;
}

function formatearFecha(fecha) {
  if (!fecha) return "";
  const d = String(fecha.getDate()).padStart(2,"0");
  const m = String(fecha.getMonth()+1).padStart(2,"0");
  const y = fecha.getFullYear();
  return `${d}/${m}/${y}`;
}

function calcularRachaSinGoles(nombre, partidos) {
  const partidosJugador = partidos
    .filter(p => (p.Huracán || "").toLowerCase().includes(nombre.toLowerCase()))
    .sort((a,b) => convertirFecha(a.Fecha) - convertirFecha(b.Fecha));

  let mejorRacha = 0, rachaActual = 0, inicioRacha = null, mejorInicio = null, mejorFin = null, ultimaFecha = null;
  
  for (const p of partidosJugador) {
    const fechaPartido = convertirFecha(p.Fecha);
    ultimaFecha = fechaPartido;
    const incidencias = p.Incidencias || "";

    let ingreso = obtenerMinutoIngreso(p.Huracán || "", nombre);
    let salida = obtenerMinutoSalida(p.Huracán || "", nombre);
    let salidaForzada = obtenerMinutoSalidaForzada(p.Incidencias || "", nombre);
    let salidaReal = (salida !== null && salidaForzada !== null) ? Math.min(salida, salidaForzada) : (salida !== null ? salida : salidaForzada);

    let finPartido = Math.max(Number(p.Fin2T) || 90, ...obtenerMinutosGolesRival(p.Incidencias || ""));
    let inicio = ingreso !== null ? ingreso : 1;
    let fin = salidaReal !== null ? salidaReal - 1 : finPartido;
    
    const goles = obtenerMinutosGolesRival(incidencias).filter(m => m >= inicio && m <= fin).sort((a,b)=>a-b);

    if (goles.length === 0) {
      if (rachaActual === 0) inicioRacha = fechaPartido;
      rachaActual += (fin - inicio + 1);
    } else {
      let cursor = inicio;
      for (const gol of goles) {
        const tramo = gol - cursor;
        if (rachaActual === 0) inicioRacha = fechaPartido;
        rachaActual += tramo;

        if (rachaActual > mejorRacha) {
          mejorRacha = rachaActual;
          mejorInicio = inicioRacha;
          mejorFin = fechaPartido;
        }
        rachaActual = 0;
        inicioRacha = null;
        cursor = gol + 1;
      }

      if (cursor <= fin) {
        if (rachaActual === 0) inicioRacha = fechaPartido;
        rachaActual += (fin - cursor + 1);
        if (rachaActual > mejorRacha) {
          mejorRacha = rachaActual;
          mejorInicio = inicioRacha;
          mejorFin = fechaPartido;
        }
      }
    }

    if (rachaActual > mejorRacha) {
      mejorRacha = rachaActual;
      mejorInicio = inicioRacha;
      mejorFin = fechaPartido;
    }
  }

  if (rachaActual > 0 && rachaActual > mejorRacha) {
    mejorRacha = rachaActual;
    mejorInicio = inicioRacha;
    mejorFin = ultimaFecha;
  }

  return { minutos: mejorRacha, inicio: mejorInicio, fin: mejorFin };
}

function ymToIndex(ym) {
  const [y, m] = ym.split("-").map(Number);
  return y * 12 + m;
}

function esClasico(rival, fecha) {
  if (!rival || !fecha) return false;
  const partes = fecha.split("/");
  const d = Number(partes[0]);
  const m = Number(partes[1]);
  const y = Number(partes[2]);

  const partidoIndex = y * 12 + m;
  const rivalNorm = rival.toLowerCase();

  return CLASICOS.some(c => {
    const desde = ymToIndex(c.desde);
    const hasta = ymToIndex(c.hasta);
    return (
      rivalNorm.includes(c.club.toLowerCase()) &&
      partidoIndex >= desde &&
      partidoIndex <= hasta
    );
  });
}

function cap(t) {
  if (!t) return "";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function calcularPuntosPartido(p, minutos) {
  const situacion = cap(norm(p.Situación));
  const condicion = cap(norm(p.Condición));

  let coef = COEF_BASE[situacion]?.[condicion] ?? 0;

  if (esInternacional(p.Torneo)) coef += 0.1;
  if (esClasico(p.Rival, p.Fecha)) coef += 0.1;
  if (esNacionalB(p.Torneo)) coef -= 0.1;

  return minutos * coef;
}

function obtenerPosicion(nombre) {
  const jugador = indiceUtbolistas[norm(nombre)];

}

function obtenerPaisNacimiento(nombre) {
  const jugador = indiceUtbolistas[norm(nombre)];
  if (!jugador || !jugador["País"]) return "-";
  return jugador["País"].split("/")[0].trim();
}

function obtenerTrayectoriaTexto(nombre) {
  const jugador = indiceUtbolistas[norm(nombre)];

}

function obtenerBanderaHTML(pais) {
  if (!pais || pais === "-") return "-";

  const url = `https://raw.githubusercontent.com/globopedia/Artids/main/Banderas/${encodeURIComponent(nombreArchivo)}`;

}

function obtenerFoto(nombre) {

function esExtranjero(nombre) {
  const jugador = indiceUtbolistas[norm(nombre)];
  if (!jugador) return false;
  const paisRaw = jugador["País"] || "";
  const paises = paisRaw.split("/").map(p => p.trim().toLowerCase());
  return paises.length > 0 && paises[0] !== "argentina";
}

function esDeInferiores(nombre) {
  const jugador = indiceUtbolistas[norm(nombre)];
  if (!jugador) return false;
  return (jugador["Procedencia"] || "").toLowerCase().includes("divisiones inferiores");
}

function calcularMayorInactividad(fechas) {
  if (!fechas || fechas.length < 2) return 0;
  const fechasValidas = fechas.filter(f => f instanceof Date && !isNaN(f));
  if (fechasValidas.length < 2) return 0;
  fechasValidas.sort((a, b) => a - b);

  let maxDiff = 0;
  for (let i = 1; i < fechasValidas.length; i++) {
    const diff = fechasValidas[i] - fechasValidas[i - 1];
    if (diff > maxDiff) maxDiff = diff;
  }
  return maxDiff;
}

function formatearTiempo(ms) {
  if (!ms || ms <= 0) return "0";
  const dias = Math.floor(ms / (1000 * 60 * 60 * 24));
  const años = Math.floor(dias / 365);
  const meses = Math.floor((dias % 365) / 30);
  const diasRestantes = dias % 30;
  return `${años}a ${meses}m ${diasRestantes}d`;
}

function generarRanking(todosLosPartidos) {
  const estadisticas = {};

  todosLosPartidos
    .filter(p => {
      if (filtroTorneo === "TODOS") return true;
      return clasificarTorneo(p.Torneo) === filtroTorneo;
    })
    .forEach(p => {
      const jugadores = (p.Huracán || "")
        .replace(/[()]/g, ",")
        .replace(/\b\d+(?:\+\d+)?\s*/g, "")
        .replace(/\.+/g, "")
        .replace(/\s+y\s+/gi, ",")
        .replace(/\s+e\s+/gi, ",")
        .replace(/,,+/g, ",")
        .replace(/\s+,/g, ",")
        .replace(/,\s+/g, ",")
        .split(/[,;]+/)
        .map(j => j.trim())
        .filter(j => j.length > 1);

      jugadores.forEach(nombre => {
        const key = norm(nombre);

        if (!estadisticas[key]) {
          estadisticas[key] = {
            nombre: nombre,
            partidos: 0,
            duco: 0,
            goles: 0,
            expulsiones: 0,
            vallasInvictas: 0,
            globopedia: 0,
            minutos: 0,
            rachaSinGoles: 0,
            rachaTexto: "",
            victorias: 0,
            empates: 0,
            anios: new Set(),
            fechas: []
          };
        }

        const j = estadisticas[key];
        const anio = convertirFecha(p.Fecha)?.getFullYear();
        if (anio) j.anios.add(anio);
        
        j.partidos++;
        j.fechas.push(convertirFecha(p.Fecha));

        const estadio = norm(p.Estadio);
        if (estadio === "el palacio" || estadio.includes("duco")) j.duco++;

        const resultado = norm(p.Situación);
        if (resultado === "victoria") j.victorias++;
        if (resultado === "empate") j.empates++;

        const minutos = calcularMinutosJugador(p, nombre);
        j.minutos += minutos;

        const puntos = calcularPuntosPartido(p, minutos);
        j.globopedia += puntos;

        if (p.Resultado2 == 0) j.vallasInvictas++;

        const incidencias = p.Incidencias || "";
        const golesRegex = new RegExp(`GOL\\s+${nombre}\\s*\\(HUR\\)`, "gi");
        const goles = incidencias.match(golesRegex);
        if (goles) j.goles += goles.length;

        const expRegex = new RegExp(`EXP\\s+${nombre.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*\\(HUR\\)`, "gi");
        const matches = incidencias.match(expRegex);
        if (matches) j.expulsiones += matches.length;
      });
    });

  return Object.values(estadisticas).map(j => {
    const listaAnios = Array.from(j.anios).sort((a,b)=>a-b);
    const periodo = construirPeriodos(listaAnios);
    const pais = obtenerPaisNacimiento(j.nombre);
    const efectividad = ((j.victorias * 3 + j.empates) * 100 / (j.partidos * 3)) || 0;
    const inactividadMs = calcularMayorInactividad(j.fechas);
    const inactividadTexto = formatearTiempo(inactividadMs);
    const trayectoriaTexto = obtenerTrayectoriaTexto(j.nombre);
    const puntajeTrayectoria = calcularPuntajeJugador(trayectoriaTexto);

    const racha = calcularRachaSinGoles(j.nombre, todosLosPartidos);
    j.rachaSinGoles = racha.minutos;

    if (racha.inicio && racha.fin) {
      j.rachaTexto = `${racha.minutos} min. -${formatearFecha(racha.inicio)} al ${formatearFecha(racha.fin)}-`;
    } else {
      j.rachaTexto = `${racha.minutos} min.`;
    }

    return {
      nombre: j.nombre,
      nombreOrden: formatearApellidoPrimero(j.nombre),
      pais: pais,
      bandera: obtenerBanderaHTML(pais),
      posicion: obtenerPosicion(j.nombre),
      foto: obtenerFoto(j.nombre),
      periodo: periodo,
      partidos: j.partidos,
      duco: j.duco,
      goles: j.goles,
      expulsiones: j.expulsiones,
      vallasInvictas: j.vallasInvictas,
      rachaSinGoles: j.rachaSinGoles,
      rachaTexto: j.rachaTexto,
      minutos: j.minutos,
      efectividad: Number(efectividad.toFixed(1)),
      globopedia: Number(j.globopedia.toFixed(1)),
      inactividad: inactividadMs,
      inactividadTexto: inactividadTexto,
      trayectoriaTexto: trayectoriaTexto,
      puntajeTrayectoria: puntajeTrayectoria
    };
  }).sort((a, b) => b.globopedia - a.globopedia);
}

function construirPeriodos(anios){
  if(anios.length===0) return "";
  let periodos = [];
  let inicio = anios[0];
  let anterior = anios[0];

  for(let i=1;i<anios.length;i++){
    if(anios[i] === anterior + 1){
      anterior = anios[i];
    } else {
      periodos.push(inicio === anterior ? `${inicio}` : `${inicio}-${anterior}`);
      inicio = anios[i];
      anterior = anios[i];
    }
  }
  periodos.push(inicio === anterior ? `${inicio}` : `${inicio}-${anterior}`);
  return periodos.join(", ");
}

function parseMinuto(valor, fallback = 0) {
  if (!valor || valor === "0") return fallback;
  const limpio = String(valor).trim();
  if (limpio.includes("+")) {
    const [base, extra] = limpio.split("+").map(Number);
    return (base || 0) + (extra || 0);
  }
  const n = Number(limpio);
  return isNaN(n) ? fallback : n;
}

function calcularMinutosJugador(p, nombre) {
  const texto = p.Huracán || "";
  let finReal = (p.Fin2E && p.Fin2E !== "0") ? parseMinuto(p.Fin2E, 120) : parseMinuto(p.Fin2T, 90);
  let minutosJugados = finReal;

  let ingreso = obtenerMinutoIngreso(texto, nombre);
  let salida  = obtenerMinutoSalida(texto, nombre);

  if (ingreso !== null) {
    let finJugador = salida !== null ? salida - 1 : finReal;
    minutosJugados = Math.max(0, finJugador - ingreso + 1);
  } else if (salida !== null) {
    minutosJugados = Math.max(0, salida - 1);
  } else {
    minutosJugados = finReal;
  }

  const incidencias = p.Incidencias || "";
  const expulsionRegex = new RegExp(`(\\d+(?:\\+\\d+)?)\\s+EXP\\s+${nombre}`, "i");

  if (expulsionRegex.test(incidencias)) {
    const m = incidencias.match(expulsionRegex)[1];
    let minutoExpulsion = m.includes("+") ? m.split("+").map(Number).reduce((a, b) => a + b) : Number(m);
    if (ingreso === null) {
      minutosJugados = Math.max(0, minutoExpulsion - 1);
    } else {
      minutosJugados = Math.max(0, minutoExpulsion - ingreso + 1);
    }
  }

  return minutosJugados;
}
