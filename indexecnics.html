    body { font-family: 'MuseoModerno', arial-black; background:#fff; color:#222; margin:20px; }
    h1 { color:#FF0000; text-align:center; }
    .logo { display:block; margin:0 auto 10px; width:100px; }
    select { padding:8px; border-radius:8px; border:2px solid #FF0000; font-size:16px; margin-bottom:20px; }
    .club-card { border:3px solid #FF0000; border-radius:20px; padding:20px; max-width:900px; margin:0 auto; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .club-header { display:flex; align-items:center; gap:15px; border-bottom:2px solid #FF0000; padding-bottom:10px; margin-bottom:10px; }
    h2 { margin:0; color:#FF0000; font-size:22px; }
    .stats { margin-top:20px; }
    .stat-group { margin-bottom:20px; padding:12px; border:1px solid #FF0000; border-radius:12px; background:#fff5f5; }
    .stat-title { font-weight:bold; color:#FF0000; margin-bottom:6px; }
    .hr { border:none; border-top:1px solid #FF0000; margin:8px 0; }
    .partido-card { border:1px solid #ccc; border-radius:6px; padding:6px; margin:4px 0; background:#fafafa; font-size:14px; text-align: center; }
    .acordeon { border: 1px solid #ddd; border-radius: 6px; margin: 6px 0; background: #fefefe; }
    .acordeon-header { background: #eee; padding: 4px 8px; cursor: pointer; font-size: 14px; text-align: right; position: relative; padding-right: 20px; }
    .acordeon-header::after { content: "▾"; position: absolute; right: 0; transition: transform 0.3s; }
    .acordeon-header.abierto::after { transform: rotate(180deg); }
    .acordeon-body { max-height: 1000px; overflow: hidden; transition: max-height 0.3s ease; padding: 8px; }
    .acordeon-body.cerrado { max-height: 0; padding: 0 8px; }
    .resultado1-box, .resultado2-box {
      display: inline-block; width: 16px; height: 28px; font-size: 32px; font-weight: bold;
      line-height: 28px; text-align: center; margin: 2px; padding: 10px 10px;
      border: 3px solid #FF0000; border-radius: 6px; background: #fff5f5;
      vertical-align: middle; min-width: 26px;
    }
    .escudo-huracan, .escudo-rival { width: 50px; height: 50px; object-fit: contain; position: relative; top: 6px; vertical-align: middle; }
    .resultado-con-escudo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content:center; }
    .stat-title small { color:#666; font-weight:normal; margin-left:6px; }

    /* === "Sus jugadores": canchita con los 11 que más dirigió === */
    .cancha {
      background: linear-gradient(#2e7d32, #1b5e20);
      border: 3px solid #fff;
      border-radius: 10px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .cancha::before {
      content: "";
      position: absolute;
      left: 8px; right: 8px; top: 50%;
      border-top: 2px solid rgba(255,255,255,0.45);
    }
    .cancha::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 70px; height: 70px;
      margin: -35px 0 0 -35px;
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 50%;
    }
    .cancha-fila {
      display: flex;
      justify-content: space-evenly;
      flex-wrap: wrap;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .cancha-fila-arquero { justify-content: center; }
    .jugador-cancha {
      width: auto;
      min-width: 76px;
      max-width: 150px;
      text-align: center;
      color: #fff;
      text-decoration: none;
      display: block;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .jugador-cancha:hover { opacity: 0.8; }
    .jugador-cancha img {
      width: 48px; height: 62px; object-fit: cover;
      border-radius: 6px; border: 2px solid #fff;
      margin-bottom: 3px;
      background: #ddd;
    }
    .jugador-cancha-nombre {
      display: block;
      font-size: 10px;
      font-weight: bold;
      line-height: 1.15;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }
    .jugador-cancha-veces {
      display: block;
      font-size: 9px;
      color: #eaffea;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }

    /* === Menú de búsqueda con autocompletado (igual al de Futbolistas) === */
    .autocomplete-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      cursor: pointer;
    }
    .autocomplete-item img {
      width: 32px;
      height: 42px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #autocompleteListTecnicos li:hover {
      background-color: #ffdddd;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(255, 0, 0, 0.2);
      transition: all 0.2s;
    }

// Mapea el texto libre de la columna Posición a una categoría fija.
// Contempla variantes/erratas reales encontradas en el CSV
// (mayúsculas sueltas, "Zaguero", "Defensor", "Full-Back", etc.)
function categorizarPosicion(posicionRaw) {
  const p = norm(posicionRaw);
  if (!p) return "desconocida";
  if (p.includes("arquero")) return "arquero";
  if (p.includes("wing izquierdo")) return "wing_izq";
  if (p.includes("wing derecho")) return "wing_der";
  if (p.includes("extremo izquierdo") || p.includes("insider izquierdo")) return "extremo_izq";
  if (p.includes("extremo derecho")) return "extremo_der";
  if (p.includes("enganche")) return "enganche";
  if (p.includes("volante izquierdo")) return "volante_izq";
  if (p.includes("volante derecho") || p.includes("half derecho")) return "volante_der";
  if (p.includes("volante central") || p === "volante") return "volante_central";
  if (p.includes("lateral izquierdo") || p.includes("defensor izquierdo")) return "lateral_izq";
  if (p.includes("lateral derecho") || p.includes("full-back") || p.includes("full back")) return "lateral_der";
  if (p.includes("defensor central") || p.includes("defensa central") || p.includes("zaguero") || p === "defensor") return "defensor_central";
  if (p.includes("delantero") || p === "elantero") return "delantero";
  return "desconocida";
}

// que pediste. La fila del arquero se maneja aparte.
const FILAS_CANCHA = [
  ["wing_izq", "delantero", "wing_der"],
  ["extremo_izq", "enganche", "extremo_der"],
  ["volante_izq", "volante_central", "volante_der"],
  ["lateral_izq", "defensor_central", "lateral_der"]
];

function obtenerFormacionTecnico(idTecnico, listaFutbolistas) {
  const partidosTecnico = encuentros.filter(p => norm(p.Técnico) === norm(idTecnico));
  if (!partidosTecnico.length) return null;

  const conteo = {};
  partidosTecnico.forEach(p => {
    const jugadores = (p.Huracán || "")
      .replace(/[()]/g, ",")
      .replace(/\b\d+(?:\+\d+)?\s*/g, "")
      .replace(/\.+/g, "")
      .replace(/\s+y\s+/gi, ",")
      .replace(/\s+e\s+/gi, ",")
      .replace(/,,+/g, ",")
      .replace(/\s+,/g, ",")
      .replace(/,\s+/g, ",")
      .replace(/\s+/g, " ")
      .split(/[,;]+/)
      .map(j => j.trim())
      .filter(j => j.length > 1);

    jugadores.forEach(nombre => {
      const clave = norm(nombre);
      if (!conteo[clave]) conteo[clave] = { nombre, veces: 0 };
      conteo[clave].veces++;
    });
  });

  const lista = Object.values(conteo)
    .map(c => {
      const datos = listaFutbolistas.find(f => norm(f.futbolista) === norm(c.nombre));
      return {
        nombre: c.nombre,
        veces: c.veces,
        foto: datos ? datos.foto1 : "",
        categoria: categorizarPosicion(datos ? datos.posicion : "")
      };
    })
    .sort((a, b) => b.veces - a.veces);

  // El arquero titular: el que más atajó, entre los que tienen esa posición
  const arquero = lista.find(j => j.categoria === "arquero") || null;

  // Los 10 jugadores de campo que más jugaron (se excluyen arqueros)
  const resto = lista.filter(j => j.categoria !== "arquero").slice(0, 10);

  return { arquero, resto };
}

// URL pública de la página de Futbolistas, para que "Sus jugadores" linkee directo al jugador.
// Ajustá esta constante si la página vive en otra dirección.
const URL_PAGINA_FUTBOLISTAS = "https://globopedia.github.io/Artids/indexutbolists.html";

function tarjetaJugadorCancha(j) {
  const url = `${URL_PAGINA_FUTBOLISTAS}?jugador=${encodeURIComponent(j.nombre)}`;
  return `
    <a class="jugador-cancha" href="${url}" target="_blank" rel="noopener">
      ${j.foto ? `<img src="${j.foto}" alt="${j.nombre}" onerror="this.style.display='none'">` : ""}
      <span class="jugador-cancha-nombre">${j.nombre}</span>
      <span class="jugador-cancha-veces">${j.veces} ${j.veces === 1 ? "partido" : "partidos"}</span>
    </a>
  `;
}

function renderFormacionTecnico(idTecnico, listaFutbolistas) {
  const formacion = obtenerFormacionTecnico(idTecnico, listaFutbolistas);
  if (!formacion || (!formacion.arquero && !formacion.resto.length)) return "";

  const filasHTML = FILAS_CANCHA.map(categorias => {
    const jugadoresFila = formacion.resto
      .filter(j => categorias.includes(j.categoria))
      .sort((a, b) => categorias.indexOf(a.categoria) - categorias.indexOf(b.categoria) || b.veces - a.veces);
    if (!jugadoresFila.length) return "";
    return `<div class="cancha-fila">${jugadoresFila.map(tarjetaJugadorCancha).join("")}</div>`;
  }).join("");

  // Jugadores sin posición reconocible en el CSV (dato vacío o atípico):
  // los mostramos en su propia fila para no perderlos, aunque no tengamos
  // dónde ubicarlos tácticamente.
  const categoriasConocidas = FILAS_CANCHA.flat();
  const sinCategoria = formacion.resto.filter(j => !categoriasConocidas.includes(j.categoria));
  const filaSinCategoria = sinCategoria.length
    ? `<div class="cancha-fila">${sinCategoria.map(tarjetaJugadorCancha).join("")}</div>`
    : "";

  const filaArquero = formacion.arquero
    ? `<div class="cancha-fila cancha-fila-arquero">${tarjetaJugadorCancha(formacion.arquero)}</div>`
    : "";

  return `
    <div class="stats" style="margin-top:20px;">
      <h3 style="color:#FF0000;">⚽ Sus jugadores</h3>
      <div class="cancha">
        ${filasHTML}
        ${filaSinCategoria}
        ${filaArquero}
      </div>
    </div>
  `;
}

function getResumenTecnico(nombreTecnico) {
  const delTecnico = encuentros.filter(p => norm(p.Técnico) === norm(nombreTecnico));
  if (!delTecnico.length) return "";

  const totalPartidos = delTecnico.length;

  const victorias = delTecnico.filter(p => norm(p.Situación) === "victoria").length;
  const empates = delTecnico.filter(p => norm(p.Situación) === "empate").length;
  const derrotas = delTecnico.filter(p => norm(p.Situación) === "derrota").length;

  const efectividad = ((victorias * 3 + empates) * 100 / ((victorias + empates + derrotas) * 3)).toFixed(1);

  // Color segun efectividad
  let color;
  if (efectividad < 30) color = "#e74c3c";        // rojo
  else if (efectividad < 45) color = "#f1c40f";   // amarillo
  else color = "#2ecc71";                         // verde

  // Fechas
  const fechasOrdenadas = delTecnico
    .map(p => p.Fecha)
    .map(f => {
      const [d, m, a] = f.split("/");
      return new Date(`${a}-${m}-${d}`);
    })
    .sort((a, b) => a - b);

  const primerAnio = fechasOrdenadas[0].getFullYear();
  const ultimoAnio = fechasOrdenadas[fechasOrdenadas.length - 1].getFullYear();

  // Cuadro de efectividad
  const badge = `<span style="
    background-color:${color};
    color:white;
    padding:3px 6px;
    border-radius:6px;
    font-weight:bold;
    font-size:14px;
    display:inline-block;
    min-width:55px;
    text-align:center;
  ">${efectividad}%</span>`;

  return `
  <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">
    <div>${totalPartidos} ${totalPartidos === 1 ? "partido" : "partidos"} (${primerAnio}-${ultimoAnio})</div>
    <div style="margin-top:2px;">${badge} de efectividad</div>
  </div>
`;
}
    function renderEstadisticas(nombreTecnico) {
      const delTecnico = encuentros.filter(p => norm(p.Técnico) === norm(nombreTecnico));
      const agg = {};
      for (const e of delTecnico) {
        const comp = bucketCompetencia(e.Torneo);
        const cond = cap(norm(e.Condición));
        const sit = cap(norm(e.Situación));
        if (!agg[comp]) agg[comp] = {};
        if (!agg[comp][cond]) agg[comp][cond] = { Victoria:0, Empate:0, Derrota:0 };
        if (SITUACIONES.includes(sit)) {
          agg[comp][cond][sit] += 1;
        }
      }
      let html = "";
      for (const comp of ORDEN_COMPETENCIAS) {
        if (!agg[comp]) continue;
        let compHTML = "";
        CONDICIONES.forEach((cond, idx) => {
          const bucket = agg[comp][cond] || { Victoria:0, Empate:0, Derrota:0 };
          const tot = bucket.Victoria + bucket.Empate + bucket.Derrota;
          if (tot === 0) return;
          let bloque = `<div class="stat-title">📍 ${cond}</div><ul>`;
          ["Victoria","Empate","Derrota"].forEach(tipo => {
            const cantidad = bucket[tipo];
            if (cantidad > 0) {
              const icono = tipo==="Victoria"?"✅":tipo==="Empate"?"🤝":"❌";
              bloque += `
                <li>
                  <label>
                    <input type="checkbox" class="chkPartidos" data-comp="${comp}" data-cond="${cond}" data-sit="${tipo}" data-tecnico="${nombreTecnico}">
                    ${icono} ${tipo}s: ${cantidad}
                  </label>
                  <div class="partidos-lista" style="display:none; margin-left:20px;"></div>
                </li>
              `;
            }
          });
          bloque += "</ul>";
          compHTML += bloque;
          if (idx < CONDICIONES.length - 1) compHTML += `<div class="hr"></div>`;
        });
        if (compHTML) {
          html += `
            <div class="stat-group">
              <div class="stat-title">🏆 ${comp}</div>
              ${compHTML}
            </div>
          `;
        }
      }
      return html || "<p>Sin datos disponibles</p>";
    }

        const fileName = nombreClub.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\./g, "").replace(/\s+/g, "") + ".png";

function InvertirNombre(nombre) {
  const partes = nombre.trim().split(" ");
  if (partes.length < 2) return nombre;

  if (partes.length === 2) {
    // Caso simple: Nombre + Apellido
    const [nombre1, apellido] = partes;
    return apellido + ", " + nombre1;
  }

  // Lista de conectores/apellidos compuestos en minúscula
  const conectores = ["de", "del", "de la", "de los", "la", "las", "los", "san", "santa"];

  // Unir las últimas palabras y ver si forman parte de un apellido compuesto
  let i = partes.length - 1;
  let apellido = partes[i];
  while (i > 0) {
    const posible = partes[i - 1].toLowerCase();
    if (conectores.includes(posible)) {
      apellido = partes[i - 1] + " " + apellido;
      i--;
    } else {
      break;
    }
  }

  const nombres = partes.slice(0, i).join(" ");
  return apellido + ", " + nombres;
}

// --- AUTOCOMPLETADO CON DEBOUNCE (mismo comportamiento que en Futbolistas) --- //
const searchInputTecnicos = document.getElementById("tecnicoSearch");
const suggestionsListTecnicos = document.getElementById("autocompleteListTecnicos");
let debounceTimerTecnicos;
let selectedIndexTecnicos = -1;

function debounceTecnicos(func, delay) {
  return function(...args) {
    clearTimeout(debounceTimerTecnicos);
    debounceTimerTecnicos = setTimeout(() => func.apply(this, args), delay);
  };
}

function filtrarTecnicos(termino) {
  const termNorm = norm(termino);
  suggestionsListTecnicos.innerHTML = "";
  selectedIndexTecnicos = -1;

  if (!termNorm) return;

  const resultados = tecnicos
    .filter(a => norm(a.tecnico).includes(termNorm))
    .slice(0, 15);

  resultados.forEach(r => {
    const li = document.createElement("li");
    li.className = "autocomplete-item";

    li.innerHTML = `
      ${r.foto
        ? `<img src="${r.foto}" onerror="this.style.display='none'">`
        : `<div style="width:32px;height:42px;"></div>`}
      <span>${r.tecnico}</span>
    `;

    li.addEventListener("click", () => {
      seleccionarTecnico(r);
    });

    suggestionsListTecnicos.appendChild(li);
  });
}

searchInputTecnicos.addEventListener("input", debounceTecnicos(e => filtrarTecnicos(e.target.value), 200));

function seleccionarTecnico(tecnico) {
  searchInputTecnicos.value = tecnico.tecnico;
  suggestionsListTecnicos.innerHTML = "";
  const hiddenSelect = document.getElementById("tecnicoSelect");
  hiddenSelect.innerHTML = `<option value="${tecnico.id}" selected></option>`;
  hiddenSelect.value = tecnico.id;
  mostrarTecnico();
}

// --- Navegación con teclado en el autocompletado --- //
searchInputTecnicos.addEventListener("keydown", function(e) {
  const items = suggestionsListTecnicos.querySelectorAll("li");

  if (e.key === "Escape") {
    suggestionsListTecnicos.innerHTML = "";
    selectedIndexTecnicos = -1;
    searchInputTecnicos.blur();
    return;
  }

  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    selectedIndexTecnicos = (selectedIndexTecnicos + 1) % items.length;
    actualizarSeleccionTecnicos(items);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    selectedIndexTecnicos = (selectedIndexTecnicos - 1 + items.length) % items.length;
    actualizarSeleccionTecnicos(items);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (selectedIndexTecnicos >= 0 && selectedIndexTecnicos < items.length) {
      items[selectedIndexTecnicos].click();
    }
  } else {
    selectedIndexTecnicos = -1;
  }
});

function actualizarSeleccionTecnicos(items) {
  items.forEach((item, i) => {
    const activo = i === selectedIndexTecnicos;
    item.style.background = activo ? "#ffdddd" : "white";
    if (activo) {
      searchInputTecnicos.value = item.textContent.trim();
    }
  });

  const selectedItem = items[selectedIndexTecnicos];
  if (selectedItem) {
    const containerTop = suggestionsListTecnicos.scrollTop;
    const containerBottom = containerTop + suggestionsListTecnicos.offsetHeight;
    const itemTop = selectedItem.offsetTop;
    const itemBottom = itemTop + selectedItem.offsetHeight;
    if (itemTop < containerTop) {
      suggestionsListTecnicos.scrollTop = itemTop;
    } else if (itemBottom > containerBottom) {
      suggestionsListTecnicos.scrollTop = itemBottom - suggestionsListTecnicos.offsetHeight;
    }
  }
}

// --- Cerrar autocompletado al hacer clic fuera --- //
document.addEventListener("click", function(e) {
  const esClickEnInput = searchInputTecnicos.contains(e.target);
  const esClickEnLista = suggestionsListTecnicos.contains(e.target);
  if (!esClickEnInput && !esClickEnLista) {
    suggestionsListTecnicos.innerHTML = "";
    selectedIndexTecnicos = -1;
  }
});
