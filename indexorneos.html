<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Torneos — Huracán</title>
  
  <!-- Manifest corregido -->
  <link rel="manifest" href="https://globopedia.github.io/manifest.json">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'MuseoModerno', sans-serif; background:#fff; color:#222; margin:20px; }
    h1 { color:#FF0000; text-align:center; }
    .logo { display:block; margin:0 auto 10px; width:100px; }
    
    .search-container { text-align:center; position:relative; margin-bottom: 20px; }
    #torneoSearch { padding:10px 14px; border-radius:10px; border:2px solid #FF0000; font-size:16px; width: 340px; outline:none; }
    
    /* Menú desplegable */
    #autocompleteList {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border: 1px solid #ccc;
      border-radius: 12px;
      width: 370px;
      max-height: 280px;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin-top: 6px;
      z-index: 1000;
      display: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      cursor: pointer;
      text-align: left;
    }

    .autocomplete-thumb {
      width: 55px;
      height: 55px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid #eee;
      background: #fdfdfd;
      flex-shrink: 0;
      padding: 2px;
    }

    .autocomplete-item span { font-weight: bold; font-size: 15px; color: #222; }

    #autocompleteList li:hover, 
    #autocompleteList li.autocomplete-active {
      background-color: #ffdddd;
      border-radius: 8px;
      transition: all 0.1s;
    }

    /* Tarjeta principal */
    .club-card { border:3px solid #FF0000; border-radius:20px; padding:20px; max-width:900px; margin:0 auto; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    .club-header { display:flex; align-items:center; gap:18px; border-bottom:2px solid #FF0000; padding-bottom:12px; margin-bottom:12px; }
    
    .torneo-img-header {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
      border: 2px solid #FF0000;
      padding: 4px;
      background: #fff;
      flex-shrink: 0;
    }

    h2 { margin:0; color:#FF0000; font-size:24px; }
    
    #torneoInfo p { font-family: 'Chakra Petch', sans-serif; margin: 4px 0; line-height: 1.3; font-size: 15px; }

    /* Acordeón y partidos */
    .acordeon { border: 1px solid #ddd; border-radius: 6px; margin: 6px 0; background: #fefefe; }
    .acordeon-header { background: #eee; padding: 6px 12px; cursor: pointer; font-size: 14px; text-align: right; position: relative; padding-right: 25px; font-weight: bold; }
    .acordeon-header::after { content: "▾"; position: absolute; right: 8px; transition: transform 0.3s; }
    .acordeon-header.abierto::after { transform: rotate(180deg); }
    .acordeon-body { max-height: 1000px; overflow: hidden; transition: max-height 0.3s ease; padding: 8px; }
    .acordeon-body.cerrado { max-height: 0; padding: 0 8px; }

    .partido-card { border:1px solid #ccc; border-radius:6px; padding:8px; margin:4px 0; background:#fafafa; font-size:14px; text-align: center; font-family: 'Chakra Petch', sans-serif; }
    .resultado1-box, .resultado2-box {
      display: inline-block; width: 16px; height: 28px; font-size: 28px; font-weight: bold;
      line-height: 28px; text-align: center; margin: 2px; padding: 8px 10px;
      border: 3px solid #FF0000; border-radius: 6px; background: #fff5f5;
      vertical-align: middle; min-width: 26px;
    }
    .escudo-huracan, .escudo-rival { width: 45px; height: 45px; object-fit: contain; vertical-align: middle; }
    .resultado-con-escudo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content:center; margin: 6px 0; }
  </style>
</head>
<body>
  <img src="https://globopedia.github.io/Artids/logo_globopedia.png" alt="Logo Huracán" class="logo" />
  <h1>🏆 Torneos y Campeonatos</h1>

  <div class="search-container">
    <label for="torneoSearch">Seleccioná torneo: </label>
    <input type="text" id="torneoSearch" placeholder="Escribí un torneo..." autocomplete="off">
    <select id="torneoSelect" style="display:none;"></select>
    <ul id="autocompleteList"></ul>
  </div>
   
  <div id="torneoInfo" class="club-card" style="display:none;"></div>

  <script>
    // Variables globales
    let torneos = [];
    let encuentros = [];
    let futbolistas = [];
    let futbolistasPorNombre = new Map();
    let clubesConFicha = new Set();
    let currentFocus = -1;

    // Función auxiliar única para limpiar acentos y mayúsculas
    function normTexto(texto) {
      return (texto || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    // Función para enlazar nombres de futbolistas
    function enlazarJugadores(texto) {
      if (!texto) return "";
      
      const partes = texto.split(/(\s*[,;().]+\s*|\s+\b[ye]\b\s+)/i);
      
      return partes.map(part => {
        if (/^(\s*[,;().]+\s*|\s+\b[ye]\b\s+)$/i.test(part)) {
          return part;
        }

        const original = part.trim();
        if (!original) return part;

        const matchMinuto = original.match(/^(\d+(?:\+\d+)?'?\s*)(.*)/);
        let prefijoMinuto = "";
        let candidatoNombre = original;

        if (matchMinuto) {
          prefijoMinuto = matchMinuto[1];
          candidatoNombre = matchMinuto[2];
        }

        const nombreLimpio = candidatoNombre.trim();
        if (!nombreLimpio) return part;

        const existeEnBase = typeof futbolistas !== "undefined" && 
          futbolistas.some(f => normTexto(f.futbolista) === normTexto(nombreLimpio));

        if (existeEnBase) {
          const url = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(nombreLimpio)}`;
          const linkHTML = `<a href="${url}" ` +
                           `style="color: #d40000; text-decoration: none; font-weight: normal;" ` +
                           `onmouseover="this.style.fontWeight='bold'" ` +
                           `onmouseout="this.style.fontWeight='normal'">${candidatoNombre}</a>`;
          return prefijoMinuto + linkHTML;
        }

        return part;
      }).join("");
    }

    function getEscudo(nombreClub) {
      if (!nombreClub) return "";
      try {
        return "https://globopedia.github.io/Artids/escudos/" + encodeURIComponent(nombreClub.trim()) + ".png";
      } catch (err) {
        return "";
      }
    }

    function renderIncidencias(texto) {
      if (!texto) return "";
      return texto
        .replace(/GOL/g, "<img src='https://globopedia.github.io/Artids/Íconos/Gol.png' alt='gol' style='width:18px;height:18px;'>")
        .replace(/EXP/g, "<img src='https://globopedia.github.io/Artids/Íconos/Roja.png' alt='expulsión' style='width:18px;height:18px;'>")
        .replace(/LES/g, "<img src='https://globopedia.github.io/Artids/Íconos/Lesionado.png' alt='lesión' style='width:18px;height:18px;'>")
        .replace(/ATA/g, "<img src='https://globopedia.github.io/Artids/Íconos/Atajada.png' alt='atajado' style='width:18px;height:18px;'>")
        .replace(/DES/g, "<img src='https://globopedia.github.io/Artids/Íconos/Fallido.png' alt='desviado' style='width:18px;height:18px;'>")
        .replace(/PEN/g, "<img src='https://globopedia.github.io/Artids/Íconos/Penales.png' alt='penales' style='width:18px;height:18px;'>");
    }

    document.addEventListener("DOMContentLoaded", function() {
      const torneosURL = "https://artids.vercel.app/api/data?file=orneos";
      const futbolistasURL = "https://artids.vercel.app/api/data?file=utbolists";
      const clubesURL = "https://artids.vercel.app/api/data?file=lubs";
      const partidosURLs = [
        "https://artids.vercel.app/api/data?file=artids1910",
        "https://artids.vercel.app/api/data?file=artids1925",
        "https://artids.vercel.app/api/data?file=artids1940",
        "https://artids.vercel.app/api/data?file=artids1955",
        "https://artids.vercel.app/api/data?file=artids1970",
        "https://artids.vercel.app/api/data?file=artids1985",
        "https://artids.vercel.app/api/data?file=artids2000",
        "https://artids.vercel.app/api/data?file=artids2015"
      ];

      Promise.all([
        fetch(torneosURL).then(r => r.text()),
        fetch(futbolistasURL).then(r => r.text()).catch(() => ""),
        fetch(clubesURL).then(r => r.text()).catch(() => ""),
        ...partidosURLs.map(url => fetch(url).then(r => r.text()))
      ])
      .then(([csvTorneos, csvFutbolistas, csvClubes, ...csvsPartidos]) => {
        
        // Cargar Torneos
        torneos = Papa.parse(csvTorneos, { header:true, skipEmptyLines:true }).data.map((c, i) => ({
          id: (c.ID ?? c.id ?? i).toString().trim(),
          nombre: (c.Torneo ?? c.Nombre ?? "").toString().trim(),
          foto: (c.Foto1 ?? c.foto1 ?? c.Foto ?? c.foto ?? c.Escudo ?? "").toString().trim(),
          datos: (c.Datos ?? c.datos ?? c.Detalle ?? "").toString().trim()
        })).filter(t => t.nombre);

        // Cargar Clubes (solo para saber cuáles tienen ficha propia en
        // indexivals.html, y así poder linkearlos con seguridad)
        clubesConFicha = new Set();
        if (csvClubes) {
          Papa.parse(csvClubes, { header:true, skipEmptyLines:true }).data.forEach(c => {
            const nombreClub = (c.Club ?? c.club ?? "").toString().trim();
            if (nombreClub) clubesConFicha.add(norm(nombreClub));
          });
        }

        // Cargar Futbolistas
        if (csvFutbolistas) {
          futbolistas = Papa.parse(csvFutbolistas, { header:true, skipEmptyLines:true }).data.map(f => ({
            futbolista: (f.Futbolista ?? f.futbolista ?? f.Nombre ?? "").toString().trim(),
            posicion: (f.Posición ?? f.posicion ?? f.Posicion ?? "").toString().trim(),
            fechNac: (f.FechaNac ?? f.fechNac ?? f.FechNac ?? "").toString().trim(),
            procedencia: (f.Procedencia ?? f.procedencia ?? "").toString().trim(),
            pais: (f.País ?? f.Pais ?? f.pais ?? "").toString().trim(),
            Foto1: (f.Foto1 ?? f.foto1 ?? "").toString().trim()
          })).filter(f => f.futbolista && f.futbolista !== "-");
        }

        // Mapa de nombre normalizado -> jugador, construido UNA sola vez.
        // Antes, cada búsqueda de un nombre dentro de una incidencia hacía
        // un .find() recorriendo TODO el array de futbolistas — multiplicado
        // por miles de nombres en todo el historial de partidos, eso era
        // el cuello de botella que hacía tardar tanto la carga inicial.
        futbolistasPorNombre = new Map();
        futbolistas.forEach(f => futbolistasPorNombre.set(norm(f.futbolista), f));

        // Cargar Partidos
        encuentros = csvsPartidos.flatMap(csv => 
          Papa.parse(csv, { header:true, skipEmptyLines:true }).data.map(p => ({
            Fecha: (p.Fecha ?? "").trim(),
            Condición: (p.Condición ?? "").trim(),
            Situación: (p.Situación ?? "").trim(),
            Resultado1: (p.Resultado1 ?? "").trim(),
            Resultado2: (p.Resultado2 ?? "").trim(),
            Club: (p.Club ?? "").trim(),
            Torneo: (p.Torneo ?? "").trim(),
            Estadio: (p.Estadio ?? "").trim(),
            Árbitro: (p.Árbitro ?? "").trim(),
            Huracán: (p.Huracán ?? "").trim(),
            Rival: (p.Rival ?? "").trim(),
            Foto: (p.Foto ?? "").trim(),
            Incidencias: (p.Incidencias ?? "").trim()
          }))
        );

        calcularDebuts();

        llenarSelectTorneos();
        inicializarAutocompletado();
      })
      .catch(err => console.error("Error cargando datos:", err));

      // ============================================================
      // === Debuts: "Incorporaciones" (debut real, en amistoso) y
      // === "Nuevas adquisiciones" (debut oficial) por jugador
      // ============================================================
      // Se calcula UNA sola vez con todo el historial de Huracán (encuentros
      // ya trae TODOS los partidos, de todos los torneos), no cada vez que
      // se cambia de torneo.
      let debutTotal = {};     // nombre -> { partido, esAmistoso, datos }
      let debutOficial = {};   // nombre -> { partido, datos } -- primer partido NO amistoso (puede ser internacional)
      let debutDomestico = {}; // nombre -> { partido, datos } -- primer partido NI amistoso NI internacional

      function calcularDebuts() {
        debutTotal = {};
        debutOficial = {};
        debutDomestico = {};

        const partidosOrdenados = encuentros
          .filter(p => p.Huracán && parseFecha(p.Fecha))
          .slice()
          .sort((a, b) => parseFecha(a.Fecha) - parseFecha(b.Fecha));

        partidosOrdenados.forEach(p => {
          const esAmistoso = norm(p.Torneo).includes("amistoso");
          // "Aislado": internacional o Copa Argentina — ninguno de los dos
          // cuenta como el debut "de verdad" en el campeonato argentino,
          // aunque sea oficial (se juegan en fechas sueltas y confunden).
          const esAislado = !esAmistoso && (esInternacional(p.Torneo) || esCopaArgentina(p.Torneo));

          const nombresEnPartido = [...new Set(
            p.Huracán.split(/[,;().\n\r]+|\s+\b[ye]\b\s+|[()]+/)
              .map(n => n.replace(/\b\d+(?:\+\d+)?'?\s*/g, "").trim())
              .filter(n => n.length > 2)
          )];

          nombresEnPartido.forEach(nom => {
            const datos = futbolistasPorNombre.get(norm(nom));
            if (!datos) return;
            const clave = datos.futbolista;

            if (!debutTotal[clave]) {
              debutTotal[clave] = { partido: p, esAmistoso, datos };
            }
            if (!esAmistoso && !debutOficial[clave]) {
              debutOficial[clave] = { partido: p, datos };
            }
            // Debut "doméstico puro" (ni amistoso, ni internacional, ni Copa
            // Argentina): si el debut oficial general de este jugador fue en
            // uno de esos torneos "aislados", este campo va a marcar un
            // partido DISTINTO y posterior — el primer campeonato argentino
            // de verdad donde jugó — para no dejarlo "perdido" ahí.
            if (!esAmistoso && !esAislado && !debutDomestico[clave]) {
              debutDomestico[clave] = { partido: p, datos };
            }
          });
        });
      }

      // Arma el HTML de una lista de debutantes (mismo estilo visual que
      // "Transferencias": foto -> flecha -> escudo del club de procedencia)
      function renderDebutantes(lista, titulo, icono) {
        if (!lista.length) return "";

        // "Inferiores" siempre al final del listado (los que llegan de otro
        // club van primero, ordenados tal cual venían).
        const listaOrdenada = [...lista].sort((a, b) => {
          const aEsInferiores = norm(a.procedencia || "") === "inferiores" ? 1 : 0;
          const bEsInferiores = norm(b.procedencia || "") === "inferiores" ? 1 : 0;
          return aEsInferiores - bEsInferiores;
        });

        return `
          <div class="stat-group">
            <div class="stat-title">${icono} ${titulo.toUpperCase()}</div>
            <ul style="list-style:none; padding:0; margin:0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; font-family:'Chakra Petch', sans-serif;">
              ${listaOrdenada.map(datos => {
                const procedenciaNorm = norm(datos.procedencia || "");
                const esInferiores = procedenciaNorm === "inferiores";
                const escudoUrl = esInferiores
                  ? getEscudo("Huracán")
                  : getEscudo(datos.procedencia && datos.procedencia !== "-" ? datos.procedencia : "");
                const fotoUrl = datos.Foto1 && datos.Foto1.trim() && datos.Foto1.trim() !== "-"
                  ? datos.Foto1
                  : "https://globopedia.github.io/Artids/logo_globopedia.png";

                // Nombre del jugador -> siempre linkea (ya sabemos que existe
                // en Utbolists.csv, porque salió de futbolistasPorNombre).
                const urlJugador = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(datos.futbolista)}`;
                const nombreHTML = `<a href="${urlJugador}" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">${escapeHTML(datos.futbolista)}</a>`;

                // Club de procedencia -> solo linkea si tiene ficha propia en
                // indexivals.html (Lubs.csv), y nunca si es "Inferiores"
                // (es el propio club, no un club rival con ficha).
                const tieneFichaClub = !esInferiores && datos.procedencia && datos.procedencia !== "-" &&
                  clubesConFicha.has(procedenciaNorm);
                const procedenciaTexto = escapeHTML(datos.procedencia || "S/D");
                const procedenciaHTML = tieneFichaClub
                  ? `<a href="https://globopedia.github.io/Artids/indexivals.html?club=${encodeURIComponent(datos.procedencia)}" target="_blank" rel="noopener" style="color:#666; text-decoration:none;">${procedenciaTexto}</a>`
                  : `<span style="color:#666;">${procedenciaTexto}</span>`;

                return `
                  <li style="display:flex; align-items:center; gap:10px; margin:0;">
                    <div style="position:relative; width:54px; height:54px; flex-shrink:0;">
                      <img src="${fotoUrl}" style="width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid #FF0000; display:block;">
                      <img src="${escudoUrl}" title="${escapeHTML(datos.procedencia || 'S/D')}"
                           style="position:absolute; bottom:-3px; right:-3px; width:26px; height:26px; object-fit:contain; background:#fff; border-radius:50%; padding:1px; box-shadow:0 1px 3px rgba(0,0,0,.4);">
                    </div>
                    <div>
                      <div style="font-weight:bold; text-transform:uppercase; font-size:13px; line-height:1.2;">${nombreHTML}</div>
                      <div style="font-size:12px;">${procedenciaHTML}</div>
                    </div>
                  </li>
                `;
              }).join("")}
            </ul>
          </div>
        `;
      }

      function llenarSelectTorneos() {
        const sel = document.getElementById("torneoSelect");
        if(!sel) return;
        sel.innerHTML = "<option value=''>-- Seleccionar --</option>";
        torneos.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t.id;
          opt.textContent = t.nombre;
          sel.appendChild(opt);
        });
        sel.addEventListener("change", mostrarTorneo);
      }

      function inicializarAutocompletado() {
        const inputSearch = document.getElementById("torneoSearch");
        const listContainer = document.getElementById("autocompleteList");
        const sel = document.getElementById("torneoSelect");

        if(!inputSearch || !listContainer) return;

        inputSearch.addEventListener("focus", function() { this.select(); });

        inputSearch.addEventListener("input", function() {
          const buscarTexto = normTexto(this.value);
          listContainer.innerHTML = "";
          currentFocus = -1;

          if (!buscarTexto) {
            listContainer.style.display = "none";
            return;
          }

          const filtrados = torneos.filter(t => normTexto(t.nombre).includes(buscarTexto));
          if (!filtrados.length) {
            listContainer.style.display = "none";
            return;
          }

          filtrados.slice(0, 10).forEach(t => {
            const li = document.createElement("li");
            li.className = "autocomplete-item";
            const imgUrl = t.foto ? t.foto : "https://globopedia.github.io/Artids/logo_globopedia.png";
            
            li.innerHTML = `
              <img src="${imgUrl}" class="autocomplete-thumb" alt="">
              <span><b>${t.nombre}</b></span>
            `;

            li.addEventListener("click", function() {
              seleccionarElemento(t.nombre, t.id);
            });
            listContainer.appendChild(li);
          });

          listContainer.style.display = "block";
        });

        inputSearch.addEventListener("keydown", function(e) {
          let items = listContainer.getElementsByTagName("li");
          if (!items.length) return;

          if (e.keyCode === 40) {
            currentFocus++;
            addActive(items);
            fixScroll(listContainer, items[currentFocus]);
          } else if (e.keyCode === 38) {
            currentFocus--;
            addActive(items);
            fixScroll(listContainer, items[currentFocus]);
          } else if (e.keyCode === 13) {
            e.preventDefault();
            if (currentFocus > -1 && items[currentFocus]) {
              items[currentFocus].click();
            }
          }
        });

        function seleccionarElemento(nombre, id) {
          inputSearch.value = nombre;
          sel.value = id;
          listContainer.style.display = "none";
          mostrarTorneo();
        }

        function addActive(items) {
          if (!items) return false;
          removeActive(items);
          if (currentFocus >= items.length) currentFocus = 0;
          if (currentFocus < 0) currentFocus = (items.length - 1);
          items[currentFocus].classList.add("autocomplete-active");
        }

        function removeActive(items) {
          for (let i = 0; i < items.length; i++) items[i].classList.remove("autocomplete-active");
        }

        function fixScroll(container, item) {
          if (!item) return;
          const containerTop = container.scrollTop;
          const containerBottom = containerTop + container.clientHeight;
          const itemTop = item.offsetTop;
          const itemBottom = itemTop + item.clientHeight;

          if (itemBottom > containerBottom) container.scrollTop = itemBottom - container.clientHeight;
          else if (itemTop < containerTop) container.scrollTop = itemTop;
        }

        document.addEventListener("click", function(e) {
          if (e.target !== inputSearch && e.target !== listContainer) {
            listContainer.style.display = "none";
          }
        });
      }

// ==========================================
// 1. DICCIONARIOS Y FUNCIONES AUXILIARES DEL HALL
// ==========================================

const COEF_BASE = {
  Victoria: { Visitante: 0.4, Neutral: 0.3, Local: 0.2 },
  Empate:   { Visitante: 0.2, Neutral: 0.1, Local: 0 },
  Derrota:  { Visitante: 0,   Neutral: -0.1, Local: -0.2 }
};

const CLASICOS = [
  { club: "San Isidro", desde: "1914-01", hasta: "1916-12" },
  { club: "Racing Club", desde: "1914-01", hasta: "1919-08" },
  { club: "Racing Club", desde: "1927-01", hasta: "1934-12" },
  { club: "Racing Club", desde: "1936-07", hasta: "1937-12" },
  { club: "Racing Club", desde: "1949-07", hasta: "1951-12" },

function norm(t) {
  return (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function cap(t) {
  if (!t) return "";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function parseMinuto(valor, fallback = 0) {
  if (!valor || valor === "0") return fallback;
  const limpio = String(valor).trim();
  if (limpio.includes("+")) {
    const [base, extra] = limpio.split("+").map(Number);
    return (base || 0) + (extra || 0);
  }
  const n = Number(limpio);
  return isNaN(n) ? fallback : n;
}

function ymToIndex(ym) {
  const [y, m] = ym.split("-").map(Number);
  return y * 12 + m;
}

function esClasico(rival, fecha) {
  if (!rival || !fecha) return false;
  const partes = fecha.split("/");
  if (partes.length < 3) return false;
  const partidoIndex = Number(partes[2]) * 12 + Number(partes[1]);
  const rivalNorm = norm(rival);

  return CLASICOS.some(c => {
    return rivalNorm.includes(norm(c.club)) &&
           partidoIndex >= ymToIndex(c.desde) &&
           partidoIndex <= ymToIndex(c.hasta);
  });
}

function esInternacional(torneo) {
  const t = norm(torneo);
  return t.includes("libertadores") || t.includes("sudamericana") || t.includes("conmebol");
}

function esCopaArgentina(torneo) {
  return norm(torneo).includes("copa argentina");
}

function esNacionalB(torneo) {
  const t = norm(torneo);
  return t.includes("nacional b") || t.includes("b nacional") || t.includes("reducido") || t.includes("bn");
}

function obtenerMinutoIngreso(texto, nombre) {
  const nombreNorm = norm(nombre);
  const regex = /\((\d+(?:\+\d+)?)\s+([^)]+)\)/g;
  let match;
  while ((match = regex.exec(texto)) !== null) {
    let minuto = match[1];
    let bloque = norm(match[2]);
    const jugadores = bloque.split(/y|,/).map(j => norm(j));
    if (jugadores.includes(nombreNorm)) {
      return minuto.includes("+") ? minuto.split("+").map(Number).reduce((a,b)=>a+b) : Number(minuto);
    }
  }
  return null;
}

function obtenerMinutoSalida(texto, futbolista) {
  const regex = new RegExp(`${futbolista}\\s*\\(\\s*(\\d+(?:\\+\\d+)?)\\s+[^()]+`, "i");
  const match = texto.match(regex);
  if (!match) return null;
  const m = match[1];
  return m.includes("+") ? m.split("+").map(Number).reduce((a,b)=>a+b) : Number(m);
}

function calcularMinutosJugador(p, nombre) {
  const texto = p.Huracán || "";
  let finReal = (p.Fin2E && p.Fin2E !== "0") ? parseMinuto(p.Fin2E, 120) : parseMinuto(p.Fin2T, 90);
  let minutosJugados = finReal;

  let ingreso = obtenerMinutoIngreso(texto, nombre);
  let salida  = obtenerMinutoSalida(texto, nombre);

  if (ingreso !== null) {
    let finJugador = salida !== null ? salida - 1 : finReal;
    minutosJugados = Math.max(0, finJugador - ingreso + 1);
  } else if (salida !== null) {
    minutosJugados = Math.max(0, salida - 1);
  } else {
    minutosJugados = finReal;
  }

  const incidencias = p.Incidencias || "";
  const expulsionRegex = new RegExp(`(\\d+(?:\\+\\d+)?)\\s+EXP\\s+${nombre.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, "i");

  if (expulsionRegex.test(incidencias)) {
    const m = incidencias.match(expulsionRegex)[1];
    let minutoExpulsion = m.includes("+") ? m.split("+").map(Number).reduce((a, b) => a + b) : Number(m);
    minutosJugados = ingreso === null ? Math.max(0, minutoExpulsion - 1) : Math.max(0, minutoExpulsion - ingreso + 1);
  }

  return minutosJugados;
}

function calcularPuntosPartido(p, minutos) {
  const situacion = cap(norm(p.Situación));
  const condicion = cap(norm(p.Condición));

  let coef = COEF_BASE[situacion]?.[condicion] ?? 0;

  if (esInternacional(p.Torneo)) coef += 0.1;
  if (esClasico(p.Club || p.Rival, p.Fecha)) coef += 0.1;
  if (esNacionalB(p.Torneo)) coef -= 0.1;

  return minutos * coef;
}

function escapeHTML(valor) {
  return (valor || "").toString()
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function parseFecha(str) {
  if (!str) return null;
  const p = str.split(/[/.-]/);
  if (p.length !== 3) return null;
  return p[0].length === 4 
    ? new Date(p[0], p[1] - 1, p[2]) 
    : new Date(p[2], p[1] - 1, p[0]);
}

function calcularEdad(fechNacStr, fechPartidoStr) {
  if (!fechNacStr || !fechPartidoStr || fechNacStr === "-") return "S/D";
  const nac = parseFecha(fechNacStr);
  const partido = parseFecha(fechPartidoStr);
  if (!nac || !partido || isNaN(nac) || isNaN(partido)) return "S/D";

  let edad = partido.getFullYear() - nac.getFullYear();
  const m = partido.getMonth() - nac.getMonth();
  if (m < 0 || (m === 0 && partido.getDate() < nac.getDate())) edad--;
  return edad > 0 ? `${edad} años` : "S/D";
}

function mostrarTorneo() {

  // Incorporaciones (debut REAL, en amistoso) y Nuevas adquisiciones (debut
  // OFICIAL) que corresponden a este torneo puntual. Usamos referencia
  // directa al objeto "partido" (no comparamos texto de torneo de nuevo),
  // así queda 100% consistente con el mismo criterio de partidosTorneo.
  const incorporaciones = Object.values(debutTotal)
    .filter(info => info.esAmistoso && partidosTorneo.includes(info.partido))
    .map(info => info.datos);

  // mismo torneo: 1) su debut oficial general (puede ser un torneo
  // internacional), y 2) si ese debut general fue justo en un torneo
  // internacional, TAMBIÉN su primer torneo doméstico — para que no quede
  // "perdido" y sí figure entre los adquiridos del campeonato argentino.
  const nombresYaListados = new Set();
  const nuevasAdquisiciones = [];

  Object.entries(debutOficial).forEach(([nombre, info]) => {
    if (partidosTorneo.includes(info.partido) && !nombresYaListados.has(nombre)) {
      nuevasAdquisiciones.push(info.datos);
      nombresYaListados.add(nombre);
    }
  });

  Object.entries(debutDomestico).forEach(([nombre, info]) => {
    const difiereDelOficialGeneral = debutOficial[nombre] && debutOficial[nombre].partido !== info.partido;
    if (difiereDelOficialGeneral && partidosTorneo.includes(info.partido) && !nombresYaListados.has(nombre)) {
      nuevasAdquisiciones.push(info.datos);
      nombresYaListados.add(nombre);
    }
  });

  const PJ = partidosTorneo.length;
  const PG = partidosTorneo.filter(p => norm(p.Situación) === "victoria").length;
  const PE = partidosTorneo.filter(p => norm(p.Situación) === "empate").length;
  const PP = partidosTorneo.filter(p => norm(p.Situación) === "derrota").length;
  const GF = partidosTorneo.reduce((s, p) => s + (parseInt(p.Resultado1) || 0), 0);
  const GC = partidosTorneo.reduce((s, p) => s + (parseInt(p.Resultado2) || 0), 0);

  // --- PROCESAR PLANTEL DEL TORNEO ---
  const mapaJugadores = {};
  const primeraFechaTorneo = partidosTorneo.length > 0 ? partidosTorneo[0].Fecha : "";

  partidosTorneo.forEach(p => {
    if (!p.Huracán) return;
    
    // FILTRO REMENDADO: Separa por comas, puntos, paréntesis, saltos y letras "y"/"e"
    const nombresEnPartido = [...new Set(
      p.Huracán.split(/[,;().\n\r]+|\s+\b[ye]\b\s+|[()]+/)
        .map(n => n.replace(/\b\d+(?:\+\d+)?'?\s*/g, "").trim())
        .filter(n => n.length > 2)
    )];

    const situacionPartido = cap(norm(p.Situación));
    const incidenciasPartido = p.Incidencias || "";

    nombresEnPartido.forEach(nom => {
      const match = futbolistasPorNombre.get(norm(nom));
      if (match) {
        const idJugador = match.futbolista;
        if (!mapaJugadores[idJugador]) {
          mapaJugadores[idJugador] = {
            datos: match,
            pj: 0,
            pg: 0,
            pe: 0,
            pp: 0,
            goles: 0,
            asistencias: 0,
            expulsiones: 0,
            vallasInvictas: 0,
            penalesAtajados: 0,
            minutos: 0,
            globopediaScore: 0
          };
        }
        
        mapaJugadores[idJugador].pj += 1;
        if (situacionPartido === "Victoria") mapaJugadores[idJugador].pg += 1;
        else if (situacionPartido === "Empate") mapaJugadores[idJugador].pe += 1;
        else if (situacionPartido === "Derrota") mapaJugadores[idJugador].pp += 1;

        // Cálculo exacto de minutos y puntaje del Hall Globopedia para este partido
        const min = calcularMinutosJugador(p, nom);
        const pts = calcularPuntosPartido(p, min);
        
        mapaJugadores[idJugador].minutos += min;
        mapaJugadores[idJugador].globopediaScore += pts;

        // Goles y expulsiones de ESTE jugador en ESTE partido, buscados en Incidencias
        const nombreEscapado = nom.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const golRegex = new RegExp(`GOL\\s+${nombreEscapado}\\s*\\(HUR\\)`, "gi");
        mapaJugadores[idJugador].goles += (incidenciasPartido.match(golRegex) || []).length;

        const expRegex = new RegExp(`EXP\\s+${nombreEscapado}\\s*\\(HUR\\)`, "i");
        if (expRegex.test(incidenciasPartido)) mapaJugadores[idJugador].expulsiones += 1;

        // Asistencias: formato "asistencia de 'Nombre' (HUR)" (las comillas son
        // opcionales acá, por si algún día se cargan sin ellas). Todavía no hay
        // datos cargados en el CSV con este formato, pero el conteo ya está listo.
        const asistRegex = new RegExp(`asistencia\\s+de\\s+['"]?${nombreEscapado}['"]?\\s*\\(HUR\\)`, "gi");
        mapaJugadores[idJugador].asistencias += (incidenciasPartido.match(asistRegex) || []).length;

        // Vallas invictas y penales atajados, solo tienen sentido para arqueros
        if (norm(match.posicion || "").includes("arquero")) {
          if ((parseInt(p.Resultado2) || 0) === 0) mapaJugadores[idJugador].vallasInvictas += 1;

          // El penal atajado se registra en el texto de Incidencias del pateador,
          // como "-ataja NombreDelArquero (HUR)-"
          const penalAtajadoRegex = new RegExp(`ataja\\s+${nombreEscapado}\\s*\\(HUR\\)`, "gi");
          mapaJugadores[idJugador].penalesAtajados += (incidenciasPartido.match(penalAtajadoRegex) || []).length;
        }
      }
    });
  });

  // Orden único por posición (en vez de agrupar por franjas de "Arqueros /
  // Defensores / Volantes / Delanteros"), para que todas las fichas se
  // acomoden en una sola grilla continua y no queden huecos grandes cuando
  // una posición tiene pocos jugadores.
  const ORDEN_POSICIONES = [
    "arquero", "lateral derecho", "defensor central", "lateral izquierdo",
    "volante derecho", "volante central", "volante izquierdo", "enganche",
    "wing derecho", "extremo derecho", "delantero", "extremo izquierdo", "wing izquierdo"
  ];

  function indicePosicion(posicionRaw) {
    const p = norm(posicionRaw || "");
    if (!p) return ORDEN_POSICIONES.length;
    if (p.includes("arquero")) return 0;
    if (p.includes("lateral derecho")) return 1;
    if (p.includes("defensor central") || p.includes("defensa central") || p.includes("zaguero") || p === "defensor") return 2;
    if (p.includes("lateral izquierdo") || p.includes("defensor izquierdo")) return 3;
    if (p.includes("volante derecho") || p.includes("half derecho")) return 4;
    if (p.includes("volante central") || p === "volante") return 5;
    if (p.includes("volante izquierdo")) return 6;
    if (p.includes("enganche")) return 7;
    if (p.includes("wing derecho")) return 8;
    if (p.includes("extremo derecho")) return 9;
    if (p.includes("delantero")) return 10;
    if (p.includes("extremo izquierdo") || p.includes("insider izquierdo")) return 11;
    if (p.includes("wing izquierdo")) return 12;
    return ORDEN_POSICIONES.length; // posición no reconocida: al final de todo
  }

  const plantelOrdenado = Object.values(mapaJugadores).sort((a, b) => {
    const posA = indicePosicion(a.datos.posicion);
    const posB = indicePosicion(b.datos.posicion);
    if (posA !== posB) return posA - posB;
    return b.globopediaScore - a.globopediaScore; // dentro de la misma posición, por puntaje
  });

  // Mientras nadie tenga ninguna asistencia cargada en este torneo, no
  // mostramos esa fila en NINGUNA ficha (para no publicar "Asistencias: 0"
  // en todas cuando en realidad es que todavía no se cargó el dato). Apenas
  // uno solo tenga alguna, la fila aparece en todo el plantel del torneo.
  const hayAsistenciasEnTorneo = Object.values(mapaJugadores).some(item => item.asistencias > 0);

  // Puntaje más alto y más bajo del plantel de Huracán EN ESTE TORNEO,
  // para ubicar a cada jugador en su segmento (de 1 a 10) dentro de ese
  // rango, y así armar la "barra de estrellas" tipo videojuego.
  const puntajesDelTorneo = Object.values(mapaJugadores).map(item => item.globopediaScore);
  const puntajeMaxTorneo = puntajesDelTorneo.length ? Math.max(...puntajesDelTorneo) : 0;
  const puntajeMinTorneo = puntajesDelTorneo.length ? Math.min(...puntajesDelTorneo) : 0;

  function calcularSegmentoEstrella(score, min, max) {
    if (max === min) return 10; // todos empatados: no hay "peor", les damos el máximo
    const paso = (max - min) / 10;
    let segmento = Math.ceil((score - min) / paso);
    if (segmento < 1) segmento = 1;
    if (segmento > 10) segmento = 10;
    return segmento;
  }

  // 5 estrellas, coloreadas de a medias, según el segmento (1 a 10 = medias
  // estrellas). El "relleno" se logra con dos capas de texto superpuestas:
  // una gris de fondo con las 5 estrellas vacías, y otra dorada arriba,
  // recortada al ancho exacto que corresponda (10% = media estrella).
  function renderEstrellas(segmento) {
    const porcentaje = segmento * 10;
    const contorno = "-1px -1px 0 #B71C1C, 1px -1px 0 #B71C1C, -1px 1px 0 #B71C1C, 1px 1px 0 #B71C1C";
    return `
      <div style="position:relative; display:inline-block; font-size:22px; letter-spacing:2px; line-height:1;" title="${(segmento / 2).toFixed(1)} / 5">
        <div style="color:#fff; text-shadow:${contorno};">★★★★★</div>
        <div style="position:absolute; top:0; left:0; width:${porcentaje}%; overflow:hidden; white-space:nowrap; color:#FFC107; text-shadow:${contorno};">★★★★★</div>
      </div>
    `;

  // Devuelve el HTML de la primera bandera del jugador (puede tener más de
  // un país separado por comas/paréntesis; para la tarjeta compacta usamos
  // solo la primera, la principal).
  function renderBanderaPrincipal(pais) {
    if (!pais) return "";

      .split(/[\(\),.;\/]|(?:\)\s*)|(?:\s*\()|(?:\s*\d+\s*)/)

      .filter(p => p.length > 0);
    if (!partes.length) return "";
    const primerPais = partes[0];
    return `<img src="https://globopedia.github.io/Artids/Banderas/${encodeURIComponent(primerPais)}.png" alt="${primerPais}" title="${primerPais}" style="height:14px; border-radius:2px; vertical-align:middle;">`;
  }

  // Armar HTML del Plantel, ya ordenado por posición (y dentro de cada
  // posición, por puntaje del Hall Globopedia) — todo en UNA sola grilla,
  // sin franjas de título por posición, para que no queden huecos grandes.
  let htmlPlantel = `<h3 style="color:#FF0000; margin-top:20px; border-bottom:2px solid #FF0000;">👥 Plantel en este Torneo</h3>`;
  htmlPlantel += `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin-bottom:15px;">`;

  plantelOrdenado.forEach(j => {
      const f = j.datos;
      
        // Foto desde columna Foto1 del CSV
        const fotoUrl = (f.Foto1 && f.Foto1.trim() !== "" && f.Foto1.trim() !== "-") 
          ? f.Foto1.trim() 
          : "https://globopedia.github.io/Artids/logo_globopedia.png";

        const edad = calcularEdad(f.fechNac, primeraFechaTorneo);
        const segmento = calcularSegmentoEstrella(j.globopediaScore, puntajeMinTorneo, puntajeMaxTorneo);
        const banderaHTML = renderBanderaPrincipal(f.pais);
        const nombreTorneoCorto = escapeHTML(
          (torneo.nombre || "")
            .replace(/campeonato\s*/gi, "")
            .replace(/-?\s*LPF/gi, "")
            .replace(/metropolitano/gi, "METRO")
            .replace(/copa\s+libertadores/gi, "Libertadores")
            .trim()
        ).toUpperCase();
        const urlJugador = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(f.futbolista)}`;
        const esArquero = norm(f.posicion || "").includes("arquero");

        // El nombre del torneo se ajusta verticalmente para que SIEMPRE entre
        // en el espacio disponible: si es corto (por ej. solo el año) se
        // ESTIRA para no quedar apretadito, y si es largo se ACHICA para que
        // no se pase del límite (antes solo estirábamos, nunca achicábamos,
        // y por eso los nombres largos no llegaban a entrar).
        const alturaDisponibleCinta = 81; // px aprox. de alto útil de la cinta, ya con más aire arriba/abajo
        const anchoTextoEstimado = nombreTorneoCorto.length * 13.5; // ~13.5px por letra a font-size 13
        let escalaCinta = anchoTextoEstimado > 0 ? alturaDisponibleCinta / anchoTextoEstimado : 1;
        if (!isFinite(escalaCinta)) escalaCinta = 1;
        if (escalaCinta < 0.62) escalaCinta = 0.62; // tope para que no quede ilegible de chiquito
        if (escalaCinta > 1.3) escalaCinta = 1.3;

        // Filas de estadísticas: para arqueros, "Vallas invictas" y "Penales
        // atajados" en vez de "Goles" y "Asistencias" (que no tienen sentido
        // para ellos). "Asistencias" además solo se muestra si hay al menos
        // una cargada en TODO el torneo (para no publicar "0" en cadena).
        const filasStats = esArquero
          ? [
              ["Partidos jugados", j.pj],
              ["Partidos ganados", j.pg],
              ["Minutos jugados", j.minutos],
              ["Vallas invictas", j.vallasInvictas],
              ["Penales atajados", j.penalesAtajados],
              ["Expulsiones", j.expulsiones]
            ]
          : [
              ["Partidos jugados", j.pj],
              ["Partidos ganados", j.pg],
              ["Minutos jugados", j.minutos],
              ["Goles", j.goles],
              ...(hayAsistenciasEnTorneo ? [["Asistencias", j.asistencias]] : []),
              ["Expulsiones", j.expulsiones]
            ];

        htmlPlantel += `
          <a href="${urlJugador}" target="_blank" rel="noopener"
             style="display:block; border:2px solid #222; border-radius:12px; overflow:hidden; text-align:center; background:#fafafa; font-family:'Chakra Petch', sans-serif; position:relative; text-decoration:none; color:inherit; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.3);">
            <div style="position:relative;">
              <img src="${fotoUrl}" onerror="this.onerror=null; this.src='https://globopedia.github.io/Artids/logo_globopedia.png';" style="width:100%; height:215px; object-fit:cover; object-position:center 15%; display:block;">

              <!-- Franja vidriada de punta a punta, en el margen izquierdo (más angosta, para que no aplaste las fotos) -->
              <div style="position:absolute; top:0; left:0; bottom:0; width:24px; background:rgba(255,255,255,.25); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); border-right:1px solid rgba(255,255,255,.4); z-index:1; display:flex; align-items:center; justify-content:center; padding:64px 0 70px; box-sizing:border-box;">
                <span style="writing-mode:vertical-rl; transform:rotate(180deg) scaleY(${escalaCinta.toFixed(2)}); transform-origin:center; font-family:'Oswald', 'Chakra Petch', sans-serif; font-weight:700; font-size:13px; letter-spacing:1.5px; color:#8B0000; text-shadow:-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; white-space:nowrap;">
                  ${nombreTorneoCorto}
                </span>
              </div>

              <!-- Escudo del torneo, arriba a la izquierda, sobre la franja vidriada (más grande, para que se distinga bien) -->
              <img src="${torneo.foto || 'https://globopedia.github.io/Artids/logo_globopedia.png'}" alt="${torneo.nombre}"
                   style="position:absolute; top:4px; left:4px; width:34px; height:34px; object-fit:contain; background:#fff; border-radius:50%; padding:2px; box-shadow:0 1px 3px rgba(0,0,0,.3); z-index:2;">

              <!-- Escudo de Huracán, en triángulo recortado en la punta superior derecha, centrado dentro del triángulo -->
              <div style="position:absolute; top:0; right:0; width:56px; height:56px; overflow:hidden; clip-path:polygon(100% 0%, 0% 0%, 100% 100%); z-index:2;">
                <div style="position:relative; width:100%; height:100%; background:#fff;">
                  <img src="https://globopedia.github.io/Artids/escudos/Huracán.png" alt="Huracán"
                       style="position:absolute; top:33%; left:67%; transform:translate(-50%,-50%); width:26px; height:26px; object-fit:contain;">
                </div>
              </div>

              <!-- El bloque de nombre/bandera/posición/edad arranca DESPUÉS de la
                   franja vidriada, no desde el margen izquierdo, para que la
                   banda nunca lo tape ni le reste contraste. -->
              <div style="position:absolute; left:24px; right:0; bottom:0; background:linear-gradient(transparent, rgba(139,0,0,.88) 45%); color:#fff; padding:22px 8px 6px; text-align:center;">
                <div style="font-weight:bold; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase;">${f.futbolista}</div>
                <div style="font-size:11px; display:flex; align-items:center; justify-content:center; gap:5px; margin-top:2px;">
                  ${banderaHTML}
                  <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${f.posicion || "S/D"}</span>
                  <span>·</span>
                  <span style="white-space:nowrap;">${edad}${edad === "S/D" ? " años" : ""}</span>
                </div>
              </div>
            </div>
            <div style="padding:3px 8px 8px;">
              ${renderEstrellas(segmento)}
              <div style="margin-top:3px; font-size:11px; background:#fff; border-radius:6px; border:1px solid #eee; overflow:hidden;">
                ${filasStats.map(([etiqueta, valor], idx) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; padding:3px 8px; ${idx % 2 === 0 ? "background:#f7f7f7;" : ""}">
                    <span style="text-align:left; color:#555;">${etiqueta}:</span>
                    <span style="text-align:right; font-weight:bold; color:#8B0000;">${valor}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </a>
        `;
  });

  htmlPlantel += `</div>`;

  // --- TARJETAS DE PARTIDOS ---
  let htmlPartidos = "";
  if (partidosTorneo.length > 0) {
    partidosTorneo.forEach(p => {
      const esVisitante = norm(p.Condición) === "visitante";
      const golesHuracan = esVisitante ? p.Resultado2 : p.Resultado1;
      const golesRival = esVisitante ? p.Resultado1 : p.Resultado2;
      const resultadoTexto = `${golesHuracan}-${golesRival}`;

      const tarjetaHTML = `
        <div class="partido-card">
          <div class="resultado-con-escudo">
            ${ esVisitante ? `
              <img class="escudo-rival" src="${getEscudo(p.Club)}" alt="${p.Club}" />
              <div class="resultado2-box">${p.Resultado2}</div>
              <div class="resultado1-box">${p.Resultado1}</div>
              <img class="escudo-huracan" src="${getEscudo('Huracán')}" alt="Huracán">
            ` : `
              <img class="escudo-huracan" src="${getEscudo('Huracán')}" alt="Huracán">
              <div class="resultado1-box">${p.Resultado1}</div>
              <div class="resultado2-box">${p.Resultado2}</div>
              <img class="escudo-rival" src="${getEscudo(p.Club)}" alt="${p.Club}" />
            `}
          </div>
          <div><b>Estadio:</b> ${p.Estadio || "S/D"} — <b>Árbitro:</b> ${p.Árbitro || "S/D"}</div>
          <div style="margin-top:4px;"><b>Huracán:</b> ${enlazarJugadores(p.Huracán)}</div>
          <div><b>${p.Club}:</b> ${enlazarJugadores(p.Rival)}</div>
          ${ p.Foto ? `<div style="margin:6px 0;"><img src="${p.Foto}" alt="Foto" style="max-width:250px;border-radius:8px;"></div>` : "" }
          <div>${renderIncidencias(p.Incidencias)}</div>
        </div>
      `;

      htmlPartidos += `
        <div class="acordeon">
          <div class="acordeon-header">${p.Club} — ${p.Fecha} (${resultadoTexto}) <img src="${getEscudo(p.Club)}" style="width:20px; vertical-align:middle; margin-left:4px;"></div>
          <div class="acordeon-body cerrado">${tarjetaHTML}</div>
        </div>
      `;
    });
  } else {
    htmlPartidos = "<i>No se encontraron partidos registrados para este torneo.</i>";
  }

  const imgTorneoUrl = torneo.foto ? torneo.foto : "https://globopedia.github.io/Artids/logo_globopedia.png";

  cont.innerHTML = `
    <div class="club-header">
      <img src="${imgTorneoUrl}" alt="${torneo.nombre}" class="torneo-img-header">
      <h2>${torneo.nombre}</h2>
    </div>
    ${torneo.datos ? `<p><b>Detalles:</b> ${torneo.datos}</p>` : ""}
    <p>Huracán disputó <b>${PJ}</b> partidos: ganó <b>${PG}</b>, empató <b>${PE}</b> y perdió <b>${PP}</b>.</p>
    <p>Goles a favor: <b>${GF}</b> | Goles en contra: <b>${GC}</b>.</p>

    ${renderDebutantes(incorporaciones, "Incorporaciones", "🆕")}
    ${renderDebutantes(nuevasAdquisiciones, "Nuevas adquisiciones", "✍️")}

    ${htmlPlantel}

    <hr style="border:none; border-top:1px solid #FF0000; margin:20px 0 15px;">
    <h3 style="color:#FF0000; margin-bottom:10px;">🗓️ Listado de Partidos</h3>
    ${htmlPartidos}
  `;
}

      document.addEventListener("click", function(e) {
        if (e.target.classList.contains("acordeon-header")) {
          const body = e.target.nextElementSibling;
          body.classList.toggle("cerrado");
          e.target.classList.toggle("abierto");
        }
      });
    });
  </script>
</body>
</html>
