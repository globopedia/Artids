/* === "Los 22 que más jugaron": canchita con ambos equipos === */
.cancha {
  background: linear-gradient(#2e7d32, #1b5e20);
  border: 3px solid #fff;
  border-radius: 10px;
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
/* En la canchita simple (un solo equipo) mostramos línea media y círculo central */
.cancha:not(.cancha-doble)::before {
  content: "";
  position: absolute;
  left: 8px; right: 8px; top: 50%;
  border-top: 2px solid rgba(255,255,255,0.45);
}
.cancha:not(.cancha-doble)::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 70px; height: 70px;
  margin: -35px 0 0 -35px;
  border: 2px solid rgba(255,255,255,0.45);
  border-radius: 50%;
}
/* En la canchita doble (rival arriba + Huracán abajo) la línea divisoria
   es un elemento propio, para que quede justo entre los dos equipos
   sin importar cuántas filas tenga cada uno. */
/* En la canchita doble (rival arriba + Huracán abajo), además de la línea
   media dibujamos las dos áreas grandes, para reforzar de un vistazo
   que esto es una canchita de fútbol y marcar dónde va cada arquero. */
.cancha-doble::before,
.cancha-doble::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: min(420px, 92%);
  height: 150px;
  border: 2px solid rgba(255,255,255,0.35);
  z-index: 0;
  pointer-events: none;
}
.cancha-doble::before { top: 2px; }
.cancha-doble::after { bottom: 2px; }
.cancha-linea-media {
  border-top: 2px solid rgba(255,255,255,0.55);
  margin: 2px 8px;
  position: relative;
  z-index: 1;
}
.cancha-fila {
  display: flex;
  justify-content: space-evenly;
  flex-wrap: wrap;
  gap: 10px;
  position: relative;
  z-index: 1;
}

  <script>
// === Fotos de futbolistas ===
// El nombre del archivo se arma solo con la columna "Futbolista": primero el
// apellido y después el nombre (y la inicial, si la hay), más " 01" (foto de
// la ficha) o " 02" (foto de adentro). La carpeta es la primera letra del
// apellido, sin tilde. Ej.: "Leandro J Díaz" -> Utbolists/UtbolistsD/Díaz Leandro J 01.jpg
// La columna "Foto" del CSV es solo para excepciones:
//  - "-" o vacía: se usa el nombre automático;
//  - un nombre (ej. "Díaz Luis Alfredo"): se usa ese nombre en lugar del automático;
//  - un link (https://...): se usa tal cual; "link1|link2" para la 01 y la 02.
// Si la foto no existe (ni .jpg ni .png), se muestra la genérica de Huracán (CAH01/CAH02).
const URL_FOTOS_FUTBOLISTAS = "https://globopedia.github.io/Artids/Utbolists/";
function nombreArchivoFutbolista(nombre) {
  const t = (nombre || "").trim().split(/\s+/).filter(Boolean);
  if (t.length < 2) return t.join(" ");
  let i = 1;
  while (i < t.length - 1 && /^[A-ZÁÉÍÓÚÑ]\.?$/.test(t[i])) i++;
  return [...t.slice(i), ...t.slice(0, i)].join(" ");
}
function urlFotoFutbolista(fila, n) {
  const futbolista = (fila.Futbolista || "").trim();
  const partes = (fila.Foto || "").split("|").map(s => s.trim());
  const excepcion = partes[n - 1] !== undefined ? partes[n - 1] : partes[0];
  if (/^https?:\/\//i.test(excepcion)) return excepcion;
  const usarExcepcion = excepcion && !/^(-|foto\d?)$/i.test(excepcion) && !/^https?:/i.test(excepcion);
  const nombre = (usarExcepcion ? excepcion : nombreArchivoFutbolista(futbolista)).normalize("NFC");
  if (!nombre) return "";
  const letra = nombre.normalize("NFD").replace(/[̀-ͯ]/g, "").charAt(0).toUpperCase();
  return URL_FOTOS_FUTBOLISTAS + "Utbolists" + letra + "/" + encodeURIComponent(nombre + " 0" + n) + ".jpg";
}
// Completa Foto1/Foto2 de cada fila a partir del nombre (o de la excepción),
// así el resto de la página las usa igual que antes.
function prepararFotosFutbolistas(filas) {
  (filas || []).forEach(f => {
    if (!f || !("Foto" in f) || !(f.Futbolista || "").trim()) return;
    f.Foto1 = urlFotoFutbolista(f, 1);
    f.Foto2 = urlFotoFutbolista(f, 2);
  });
  return filas;
}
// Escudo de un nombre anterior (ej. "Sportivo del Norte"): si todavía no hay
// un png con ese nombre, se muestra el escudo del club con su nombre actual.
document.addEventListener("error", ev => {
  const img = ev.target;
  if (!img || img.tagName !== "IMG" || img.dataset.escudoActual) return;
  const src = img.currentSrc || img.src || "";
  if (src.indexOf("/Artids/escudos/") === -1) return;
  const nombre = decodeURIComponent(src.split("/escudos/").pop()).replace(/\.png$/i, "");
  const clave = norm(nombre);
  const actual = (typeof clubes !== "undefined" ? clubes : []).find(c => ALIAS_CLUB[clave] && norm(c.club) === ALIAS_CLUB[clave]);
  if (!actual) return;
  img.dataset.escudoActual = "1";
  img.src = getEscudo(actual.club);
}, true);
// Si una foto de futbolista no existe: probar .png y, si tampoco, la genérica.
document.addEventListener("error", ev => {
  const img = ev.target;
  if (!img || img.tagName !== "IMG") return;
  const src = img.currentSrc || img.src || "";
  if (src.indexOf("/Artids/Utbolists/") === -1 || /\/CAH0[12]\./.test(src)) return;
  const m = decodeURIComponent(src).match(/ 0([12])\.(jpg|png)$/i);
  const n = m ? m[1] : "1";
  ev.stopPropagation();
  img.style.visibility = "";
  if (/\.jpg$/i.test(src) && !img.dataset.probePng) {
    img.dataset.probePng = "1";
    img.src = src.replace(/\.jpg$/i, ".png");
  } else {
    img.src = URL_FOTOS_FUTBOLISTAS + "UtbolistsH/CAH0" + n + ".jpg";
  }
}, true);

// === Fotos de partidos ===
// La columna "Foto" de los CSV puede traer:
//  - un link completo (https://...): se usa tal cual;
//  - un código de fecha AAAAMMDD (ej. 19931205): la foto se busca en el repo
//    Artids, carpeta Artido/AAAA/ (ej. Artido/1993/19931205.jpg). Se prueba
//    primero .jpg y, si no existe, .png y .jpeg. También se puede escribir el
//    código con extensión (ej. 19931205.png) o con una letra al final para un
//    segundo partido del mismo día (ej. 19931205b).
// Si no hay foto (vacío, "Foto", "-") o el archivo no existe, no se muestra nada.
const URL_FOTOS_PARTIDOS = "https://globopedia.github.io/Artids/Artido/";
const EXT_FOTOS_PARTIDOS = ["jpg", "png", "jpeg"];
function urlFotoPartido(valor) {
  const v = (valor || "").trim();
  if (/^https?:\/\//i.test(v)) return v;
  const m = v.match(/^(\d{4})\d{4}[a-z]?(\.(jpe?g|png|webp|gif))?$/i);
  if (!m) return "";
  return URL_FOTOS_PARTIDOS + m[1] + "/" + (m[2] ? v : v + "." + EXT_FOTOS_PARTIDOS[0]);
}
function fotoPartidoSiguienteFormato(img) {
  const i = parseInt(img.dataset.ext || "0", 10) + 1;
  if (img.dataset.codigo !== "1" || i >= EXT_FOTOS_PARTIDOS.length) {
    img.parentElement.style.display = "none";
    return;
  }
  img.dataset.ext = String(i);
  img.src = img.src.replace(/\.[^./]+$/, "." + EXT_FOTOS_PARTIDOS[i]);
}
function htmlFotoPartido(valor, alt = "") {
  const url = urlFotoPartido(valor);
  if (!url) return "";
  const v = (valor || "").trim();
  const esCodigoSinExtension = /^\d{8}[a-z]?$/i.test(v) ? "1" : "0";
  return `<div style="margin:6px 0;"><img src="${url}" alt="${alt}" data-codigo="${esCodigoSinExtension}" loading="lazy" style="max-width:250px;border-radius:8px;" onerror="fotoPartidoSiguienteFormato(this)"></div>`;
}

const clubesURL = "https://artids.vercel.app/api/data?file=lubs";
const partidosURL = "https://artids.vercel.app/api/data?file=artids1910";
const partidosURL2 = "https://artids.vercel.app/api/data?file=artids1925";
const partidosURL3 = "https://artids.vercel.app/api/data?file=artids1940";
const partidosURL4 = "https://artids.vercel.app/api/data?file=artids1955";
const partidosURL5 = "https://artids.vercel.app/api/data?file=artids1970";
const partidosURL6 = "https://artids.vercel.app/api/data?file=artids1985";
const partidosURL7 = "https://artids.vercel.app/api/data?file=artids2000";
const partidosURL8 = "https://artids.vercel.app/api/data?file=artids2015";
const transfersURL = "https://artids.vercel.app/api/data?file=utbolistsa";
const transfersURL2 = "https://artids.vercel.app/api/data?file=utbolistse";
const transfersURL3 = "https://artids.vercel.app/api/data?file=utbolistso";
const arbitrosURL = "https://artids.vercel.app/api/data?file=rbits";
    let transfers = [];
    let clubes = [];
    let encuentros = [];
    let futbolistas = [];
    let arbitros = [];

   // Normalizaciones y utilidades
const norm = (t) => (t || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
// Nombres anteriores de un club (columna "Anterior" de Ivals.csv, separados por "|"):
// se aceptan como si fueran el nombre actual al filtrar partidos, pases y trayectorias.
let ALIAS_CLUB = {};
const normClub = (t) => { const k = norm(t); return ALIAS_CLUB[k] || k; };
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;

function plural(n, singular, plural) {
  return n === 1 ? singular : plural;
}

function capitalizarPrimera(frase) {
  if (!frase) return "";
  return frase.charAt(0).toUpperCase() + frase.slice(1);
}
function conjY(palabra) {
  const p = palabra.toLowerCase().trim();
  if (p.startsWith("i") || p.startsWith("hi")) {
    return "e";
  }
  return "y";
}

function parseFecha(fecha) {
  if (!fecha) return null;
  const [d,m,a] = fecha.split("/");
  return new Date(a, m-1, d);
}

function formatMesAnio(date) {
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return meses[date.getMonth()] + date.getFullYear();
}

function sumarUnMes(date) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + 1);
  return d;
}

function obtenerTransferencias(nombreClub) {
  const lista = [];

  // Un mismo jugador puede tener MÁS DE UNA fila de Utbolists.csv, si volvió
  // al club más de una vez (ej: llega de Platense en 1931, se va a Defensor
  // en 1943, vuelve de Banfield en 1945). Agrupamos sus filas preservando el
  // orden en que aparecen en el CSV -- asumimos que ese orden refleja el
  // orden cronológico real de sus etapas en el club.
  const filasPorJugador = {};
  transfers.forEach(t => {
    if (!filasPorJugador[t.jugador]) filasPorJugador[t.jugador] = [];
    filasPorJugador[t.jugador].push(t);
  });

  Object.entries(filasPorJugador).forEach(([nombreJugador, filas]) => {
    const periodos = obtenerPeriodosJugador(nombreJugador);
    if (!periodos.length) return;

    filas.forEach((t, i) => {
      // Emparejamos la fila N con el período N (mismo orden cronológico) en
      // vez de usar siempre el primer/último período de toda su carrera —
      // así cada etapa de ida y vuelta queda con su fecha real, no todas
      // apuntando al primer debut. Si hubiera más filas que períodos
      // detectados (o menos), usamos el último disponible como resguardo.
      const periodo = periodos[Math.min(i, periodos.length - 1)];

      // desde el rival hacia Huracán
      if (normClub(t.procedencia) === normClub(nombreClub)) {
        lista.push({
          jugador: t.jugador,
          foto: t.foto,
          tipo: "llega",
          fecha: formatMesAnio(periodo.primera),
          fechaObj: periodo.primera
        });
      }

      // desde Huracán hacia el rival
      if (normClub(t.destino) === normClub(nombreClub)) {
        lista.push({
          jugador: t.jugador,
          foto: t.foto,
          tipo: "sale",
          fecha: formatMesAnio(sumarUnMes(periodo.ultima)),
          fechaObj: sumarUnMes(periodo.ultima)
        });
      }
    });
  });

  return lista.sort((a,b) => a.fechaObj - b.fechaObj);
}
    function bucketCompetencia(torneo) {
      const t = norm(torneo);
      // Primero los amistosos: si el nombre dice "(amistoso)", no es oficial
      // aunque también diga "Torneo", "Campeonato", "Copa", etc.
      if (t.includes("amistoso")) return "No oficiales";

// Mapea el texto libre de Posición a una categoría fija (mismo criterio que en Técnicos)
function categorizarPosicion(posicionRaw) {
  const p = norm(posicionRaw);
  if (!p) return "desconocida";
  if (p.includes("arquero")) return "arquero";
  if (p.includes("wing izquierdo")) return "wing_izq";
  if (p.includes("wing derecho")) return "wing_der";
  if (p.includes("extremo izquierdo") || p.includes("insider izquierdo")) return "extremo_izq";
  if (p.includes("extremo derecho")) return "extremo_der";
  if (p.includes("enganche")) return "enganche";
  if (p.includes("volante izquierdo")) return "volante_izq";
  if (p.includes("volante derecho") || p.includes("half derecho")) return "volante_der";
  if (p.includes("volante central") || p === "volante") return "volante_central";
  if (p.includes("lateral izquierdo") || p.includes("defensor izquierdo")) return "lateral_izq";
  if (p.includes("lateral derecho") || p.includes("full-back") || p.includes("full back")) return "lateral_der";
  if (p.includes("defensor central") || p.includes("defensa central") || p.includes("zaguero") || p === "defensor") return "defensor_central";
  if (p.includes("delantero") || p === "elantero") return "delantero";
  return "desconocida";
}

// Filas de ataque (arriba) a defensa (abajo). El arquero se maneja aparte.
const FILAS_CANCHA = [
  ["wing_izq", "delantero", "wing_der"],
  ["extremo_izq", "enganche", "extremo_der"],
  ["volante_izq", "volante_central", "volante_der"],
  ["lateral_izq", "defensor_central", "lateral_der"]
];

// === Deducción de posición a partir de la propia línea de formación ===
// Necesaria para los jugadores RIVALES: no están en Utbolists.csv (esa base
// es solo el plantel de Huracán), así que no tienen Posición cargada. En vez
// de dejarlos afuera, deducimos su rol leyendo directamente la columna
// Huracán/Rival, que viene separada por ";" en líneas tácticas
// (arquero; defensa; medio; ataque), y por "," / "y" dentro de cada línea.

// Plantillas para las formaciones más comunes: la clave es la cantidad de
// titulares por línea (sin el arquero), ej. "4-3-3". El array asigna la
// categoría de cada nombre según su posición de izquierda a derecha en esa línea.
const PLANTILLAS_FORMACION = {
  "2-3-5": [
    ["defensor_central", "defensor_central"],
    ["volante_der", "volante_central", "volante_izq"],
    ["wing_der", "extremo_der", "delantero", "extremo_izq", "wing_izq"]
  ],
  "4-2-4": [
    ["lateral_der", "defensor_central", "defensor_central", "lateral_izq"],
    ["volante_der", "volante_izq"],
    ["wing_der", "delantero", "enganche", "wing_izq"]
  ],
  "4-3-3": [
    ["lateral_der", "defensor_central", "defensor_central", "lateral_izq"],
    ["volante_der", "volante_central", "volante_izq"],
    ["wing_der", "delantero", "wing_izq"]
  ],
  "4-4-2": [
    ["lateral_der", "defensor_central", "defensor_central", "lateral_izq"],
    ["volante_der", "volante_central", "enganche", "volante_izq"],
    ["delantero", "delantero"]
  ],
  "3-5-2": [
    ["lateral_der", "defensor_central", "lateral_izq"],
    ["extremo_der", "volante_der", "volante_central", "volante_izq", "extremo_izq"],
    ["delantero", "delantero"]
  ]
};

// Reparto genérico para cuando la cantidad de titulares de una línea no
// coincide con ninguna plantilla conocida (formaciones no contempladas,
// o líneas "infladas" por errores de carga). Toma muestras equiespaciadas
// de un patrón de referencia según el rol de la línea (defensa/medio/ataque),
// así el jugador cae en una fila razonable aunque no sepamos el detalle exacto.
const PATRON_GENERICO = {
  defensa: ["lateral_izq", "defensor_central", "defensor_central", "defensor_central", "lateral_der"],
  medio:   ["extremo_izq", "volante_izq", "volante_central", "volante_der", "extremo_der"],
  ataque:  ["wing_izq", "extremo_izq", "delantero", "extremo_der", "wing_der"]
};

function categoriasGenericas(rol, cantidad) {
  const patron = PATRON_GENERICO[rol];
  if (cantidad <= 0) return [];
  if (cantidad === 1) return [rol === "defensa" ? "defensor_central" : rol === "ataque" ? "delantero" : "volante_central"];
  const resultado = [];
  for (let i = 0; i < cantidad; i++) {
    const idx = Math.round(i * (patron.length - 1) / (cantidad - 1));
    resultado.push(patron[idx]);
  }
  return resultado;
}

// Asigna categoría a cada nombre de cada línea (sin el arquero), probando
// primero la plantilla exacta y, si no calza, el reparto genérico por rol.
function asignarCategoriasPorFormacion(lineasTitulares) {
  const forma = lineasTitulares.map(l => l.length).join("-");
  const plantilla = PLANTILLAS_FORMACION[forma];
  if (plantilla) {
    return lineasTitulares.map((linea, i) => linea.map((_, j) => plantilla[i][j]));
  }

  const roles = lineasTitulares.length <= 1
    ? lineasTitulares.map(() => "medio")
    : lineasTitulares.map((_, i) =>
        i === 0 ? "defensa" : i === lineasTitulares.length - 1 ? "ataque" : "medio");

  return lineasTitulares.map((linea, i) => categoriasGenericas(roles[i], linea.length));
}

// Separa una línea táctica ("Fulano, Mengano (70 Suplente) y Zutano") en sus
// titulares, capturando el suplente de cada uno ANTES de limpiar los
// paréntesis — así el conteo de titulares por línea no se infla con los
// nombres de los suplentes (lo que rompería el matcheo de formación).
function extraerLineaConSuplentes(segmentoTexto) {
  const subsPorTitular = {};
  const regexSub = /([^,()]+?)\s*\(([^)]*)\)/g;
  let m;
  while ((m = regexSub.exec(segmentoTexto)) !== null) {
    const titular = m[1].trim();
    const sup = m[2].trim().replace(/^\d+(?:\+\d+)?'?\s*/, "");
    if (sup) subsPorTitular[norm(titular)] = sup;
  }

  const limpio = segmentoTexto.replace(/\([^)]*\)/g, "");
  const titulares = limpio
    .replace(/\.+/g, "")
    .replace(/\by\s+/g, ",")
    .replace(/\be\s+/g, ",")
    .replace(/,,+/g, ",")
    .replace(/\s+,/g, ",")
    .replace(/,\s+/g, ",")
    .replace(/\s+/g, " ")
    .split(/[,;]+/)
    .map(j => j.trim())
    .filter(j => j.length > 1);

  return titulares.map(nombre => ({ nombre, suplente: subsPorTitular[norm(nombre)] || null }));
}

// Parsea la columna completa (Huracán o Rival) de UN partido y devuelve la
// lista de jugadores con la categoría deducida de la formación. El suplente
// hereda la categoría del titular al que reemplazó.
function parsearFormacionColumna(texto) {
  if (!texto) return [];
  const segmentos = texto.split(";").map(s => s.trim()).filter(Boolean);
  if (!segmentos.length) return [];

  // Si el texto no viene separado en al menos 2 líneas (";"), no hay
  // estructura táctica real para leer — puede ser una carga vieja con todos
  // los nombres en una sola lista. En ese caso NO asumimos que el primer
  // segmento es el arquero (nos inflaría esa categoría con todo el plantel);
  // devolvemos los nombres sin categoría, para que sigan contando presencias
  // pero no distorsionen el resto.
  if (segmentos.length < 2) {
    return extraerLineaConSuplentes(segmentos[0]).flatMap(j => {
      const items = [{ nombre: j.nombre, categoria: "desconocida" }];
      if (j.suplente) items.push({ nombre: j.suplente, categoria: "desconocida" });
      return items;
    });
  }

  const resultado = [];

  // Primera línea = arquero (y su suplente, si lo hay)
  const lineaArquero = extraerLineaConSuplentes(segmentos[0]);
  lineaArquero.forEach(j => {
    resultado.push({ nombre: j.nombre, categoria: "arquero" });
    if (j.suplente) resultado.push({ nombre: j.suplente, categoria: "arquero" });
  });

  // Resto de líneas = defensa / medio / ataque, según formación
  const lineasConSuplentes = segmentos.slice(1).map(extraerLineaConSuplentes);
  const lineasNombres = lineasConSuplentes.map(l => l.map(x => x.nombre));
  const categoriasPorLinea = asignarCategoriasPorFormacion(lineasNombres);

  lineasConSuplentes.forEach((linea, i) => {
    linea.forEach((jugador, j) => {
      const categoria = (categoriasPorLinea[i] && categoriasPorLinea[i][j]) || "desconocida";
      resultado.push({ nombre: jugador.nombre, categoria });
      if (jugador.suplente) resultado.push({ nombre: jugador.suplente, categoria });
    });
  });

  return resultado;
}

// Cuenta apariciones en una columna (Huracán o Rival) de una lista de partidos ya filtrada,
// y arma el "arquero titular" + los 10 de campo que más jugaron.
// La categoría de cada jugador sale, en orden de preferencia:
//   1) su Posición real en Utbolists.csv, si está cargado ahí (jugadores de Huracán)
//   2) la posición deducida de la formación del partido (jugadores rivales, o
//      cualquiera que por algún motivo no esté en la base)
// Si un jugador no tiene foto propia en la base (típico de jugadores rivales que no
// pasaron por Huracán), usamos el escudo del club como respaldo.
// Recorre la lista ya ordenada por partidos jugados y arma el "resto" (los
// jugadores de campo), respetando un tope de jugadores por línea táctica.
// Si una línea ya llegó al tope, el siguiente candidato que le tocaría esa
// línea se saltea (no se descarta del todo el concepto de "quién jugó más":
// simplemente cede su lugar al que sigue en la lista, que sí entra en una
// línea con espacio disponible).
function seleccionarRestoConTope(listaOrdenada, maxPorLinea = 5, maxTotal = 10, filas = FILAS_CANCHA) {
  const contadorPorFila = filas.map(() => 0);
  const elegidos = [];

  for (const jugador of listaOrdenada) {
    if (elegidos.length >= maxTotal) break;

    const filaIndex = filas.findIndex(categorias => categorias.includes(jugador.categoria));

    // Categoría no reconocida (cae en la fila "sin categoría" al renderizar):
    // no le aplicamos tope de línea, porque no compite por un lugar fijo.
    if (filaIndex === -1) {
      elegidos.push(jugador);
      continue;
    }

    if (contadorPorFila[filaIndex] >= maxPorLinea) continue; // línea llena, lo salteamos

    contadorPorFila[filaIndex]++;
    elegidos.push(jugador);
  }

  return elegidos;
}

function obtenerFormacionEquipo(partidosFiltrados, columna, listaFutbolistas, nombreClubFallback) {
  const conteo = {}; // clave -> { nombre, veces, categoriasDeducidas: {cat: n} }

  partidosFiltrados.forEach(p => {
    parsearFormacionColumna(p[columna] || "").forEach(({ nombre, categoria }) => {
      const clave = norm(nombre);
      if (!conteo[clave]) conteo[clave] = { nombre, veces: 0, categoriasDeducidas: {} };
      conteo[clave].veces++;
      conteo[clave].categoriasDeducidas[categoria] = (conteo[clave].categoriasDeducidas[categoria] || 0) + 1;
    });
  });

  const lista = Object.values(conteo)
    .map(c => {
      const datos = listaFutbolistas.find(f => norm(f.futbolista) === norm(c.nombre));
      const tieneFotoPropia = !!(datos && datos.foto1);

      // Preferimos la posición real (Huracán); si no está, la más frecuente
      // entre las que le dedujimos de la formación en los partidos donde jugó.
      const categoriaReal = datos ? categorizarPosicion(datos.posicion) : "desconocida";
      const categoriaDeducida = Object.entries(c.categoriasDeducidas)
        .sort((a, b) => b[1] - a[1])[0][0];
      const categoria = categoriaReal !== "desconocida" ? categoriaReal : categoriaDeducida;

      return {
        nombre: c.nombre,
        veces: c.veces,
        foto: tieneFotoPropia ? datos.foto1 : getEscudo(nombreClubFallback),
        esEscudo: !tieneFotoPropia,
        categoria: categoria
      };
    })
    .sort((a, b) => b.veces - a.veces);

  const arquero = lista.find(j => j.categoria === "arquero") || null;
  const candidatos = lista.filter(j => j.categoria !== "arquero");
  const resto = seleccionarRestoConTope(candidatos, 5, 10);

  return { arquero, resto };
}

function tarjetaJugadorCancha(j, esArquero = false) {
  const claseArquero = esArquero ? " jugador-cancha-arquero" : "";
  const contenido = `
    <img src="${j.foto}" alt="${j.nombre}" onerror="this.style.visibility='hidden'">
    <span class="jugador-cancha-nombre">${j.nombre}</span>
    <span class="jugador-cancha-veces">${j.veces} ${j.veces === 1 ? "partido" : "partidos"}</span>
  `;

  // Si no tiene foto propia (mostramos el escudo del club), no hay ficha

}

}

function renderFormacionRival(nombreClubRival) {
  const partidosClub = encuentros.filter(p => normClub(p.Club) === normClub(nombreClubRival));
  if (!partidosClub.length) return "";

  const formacionRival = obtenerFormacionEquipo(partidosClub, "Rival", futbolistas, nombreClubRival);
  const formacionHuracan = obtenerFormacionEquipo(partidosClub, "Huracán", futbolistas, "Huracán");

  const hayRival = formacionRival.arquero || formacionRival.resto.length;
  const hayHuracan = formacionHuracan.arquero || formacionHuracan.resto.length;
  if (!hayRival && !hayHuracan) return "";

  // Rival: arquero arriba, ataque abajo (orden invertido respecto a Huracán)
  const filasRivalHTML = [...FILAS_CANCHA].reverse()
    .map(categorias => filaFormacionHTML(categorias, formacionRival.resto)).join("");
  const arqueroRivalHTML = formacionRival.arquero
    ? `<div class="cancha-fila cancha-fila-arquero">${tarjetaJugadorCancha(formacionRival.arquero, true)}</div>`
    : "";

  // Huracán: ataque arriba, arquero abajo (orden normal, igual que en Técnicos)
  const filasHuracanHTML = FILAS_CANCHA
    .map(categorias => filaFormacionHTML(categorias, formacionHuracan.resto)).join("");
  const arqueroHuracanHTML = formacionHuracan.arquero
    ? `<div class="cancha-fila cancha-fila-arquero">${tarjetaJugadorCancha(formacionHuracan.arquero, true)}</div>`
    : "";

  return `
    <div class="stats" style="margin-top:20px;">
      <h3 style="color:#FF0000;">⚽ Los 22 que más jugaron este cruce</h3>
      <div class="cancha cancha-doble">
        ${arqueroRivalHTML}
        ${filasRivalHTML}
        <div class="cancha-linea-media"></div>
        ${filasHuracanHTML}
        ${arqueroHuracanHTML}
      </div>
    </div>
  `;
}

// ============================================================
// === "Los vendidos" y "Los conversos"
// ============================================================
// Vendidos: jugaron primero en Huracán y DESPUÉS en el rival.
// Conversos: jugaron primero en el rival y DESPUÉS en Huracán.
// Sale de la columna Trayectoria de Utbolists (A, E, O), que lista los
// clubes en orden cronológico separados por coma. Si un jugador fue y
// vino (rival → Huracán → rival) entra en los dos cuadros.
// Selección, igual que en la canchita: un solo arquero (el que más jugó
// en Huracán) y hasta 5 por línea; si una línea ya está llena, el que
// sigue en la lista pasa de largo y entra el siguiente de otra línea.
// Si hay más de 11, quedan los 11 que más jugaron en Huracán; si hay
// menos, van los que haya.

// Partidos jugados en Huracán por cada jugador (titular o suplente que
// entró), contado una vez por partido. Se calcula una sola vez, la
// primera vez que se necesita, porque recorre todos los partidos.
let cachePartidosEnHuracan = null;
function obtenerPartidosEnHuracan() {
  if (cachePartidosEnHuracan) return cachePartidosEnHuracan;
  const conteo = {}; // norm(nombre) -> { veces, categoriasDeducidas }
  encuentros.forEach(p => {
    const yaContados = new Set();
    parsearFormacionColumna(p.Huracán || "").forEach(({ nombre, categoria }) => {
      const clave = norm(nombre);
      if (yaContados.has(clave)) return;
      yaContados.add(clave);
      if (!conteo[clave]) conteo[clave] = { veces: 0, categoriasDeducidas: {} };
      conteo[clave].veces++;
      conteo[clave].categoriasDeducidas[categoria] = (conteo[clave].categoriasDeducidas[categoria] || 0) + 1;
    });
  });
  cachePartidosEnHuracan = conteo;
  return conteo;
}

// Devuelve { vendidos, conversos } con los jugadores que cumplen cada
// condición respecto de nombreClubRival (sin recortar todavía a 11).
function obtenerVendidosYConversos(nombreClubRival) {
  const claveRival = normClub(nombreClubRival);
  const claveHuracan = norm("Huracán");
  const partidosEnHuracan = obtenerPartidosEnHuracan();

  const vendidos = [];
  const conversos = [];
  const vistos = new Set(); // un jugador puede tener varias filas (idas y vueltas)

  futbolistas.forEach(f => {
    const claveJugador = norm(f.futbolista);
    if (!claveJugador || vistos.has(claveJugador)) return;

    const clubes = f.trayectoria.split(",").map(c => normClub(c)).filter(Boolean);
    const posHuracan = clubes.map((c, i) => c === claveHuracan ? i : -1).filter(i => i >= 0);
    const posRival = clubes.map((c, i) => c === claveRival ? i : -1).filter(i => i >= 0);
    // Tiene que haber pasado por los dos clubes; si solo jugó en Huracán, no entra.
    if (!posHuracan.length || !posRival.length) return;
    vistos.add(claveJugador);

    // Posición: la real cargada en Utbolists; si no está, la que más se
    // le dedujo de las formaciones de Huracán (mismo criterio que la canchita).
    const datosPartidos = partidosEnHuracan[claveJugador] || { veces: 0, categoriasDeducidas: {} };
    let categoria = categorizarPosicion(f.posicion);
    if (categoria === "desconocida") {
      const deducida = Object.entries(datosPartidos.categoriasDeducidas).sort((a, b) => b[1] - a[1])[0];
      if (deducida) categoria = deducida[0];
    }

    const jugador = {
      nombre: f.futbolista,
      foto: f.foto1,
      veces: datosPartidos.veces,
      categoria
    };

    // Cuenta solo el PRIMER cruce entre los dos clubes: si Huracán aparece
    // antes que el rival es vendido; si el rival aparece antes, converso.
    // Las idas y vueltas posteriores no cambian nada (nunca va en los dos).
    if (Math.min(...posHuracan) < Math.min(...posRival)) vendidos.push(jugador);
    else conversos.push(jugador);
  });

  return { vendidos, conversos };
}

// Las tres líneas para el tope de 5 (distinto de la canchita, que divide
// el ataque en dos): defensores, volantes (con el enganche) y atacantes.
const LINEAS_PASE = [
  ["lateral_der", "defensor_central", "lateral_izq"],
  ["volante_der", "volante_central", "volante_izq", "enganche"],
  ["wing_der", "extremo_der", "delantero", "extremo_izq", "wing_izq"]
];

// Arma "el equipo": un arquero + hasta 10 con tope de 5 por línea.
function elegirOnce(jugadores) {
  const ordenados = [...jugadores].sort((a, b) => b.veces - a.veces || a.nombre.localeCompare(b.nombre));
  const arquero = ordenados.find(j => j.categoria === "arquero") || null;
  const candidatos = ordenados.filter(j => j.categoria !== "arquero");
  const resto = seleccionarRestoConTope(candidatos, 5, 10, LINEAS_PASE);
  return { arquero, resto };
}

// Orden de izquierda a derecha, inspirado en las formaciones de antes.
// Fila de arriba: arquero, defensores, volante derecho, volante central
// y volante izquierdo. Fila de abajo: wing derecho, extremo derecho,
// delantero, enganche, extremo izquierdo y wing izquierdo.
const FILA_ARRIBA_PASE = [
  "arquero",
  "lateral_der", "defensor_central", "lateral_izq",
  "volante_der", "volante_central", "volante_izq"
];
const FILA_ABAJO_PASE = [
  "wing_der", "extremo_der", "delantero", "enganche", "extremo_izq", "wing_izq",
  "desconocida"
];

function tarjetaJugadorPase(j) {
  const claseArquero = j.categoria === "arquero" ? " jugador-pase-arquero" : "";
  const nombre = escapeHTML(j.nombre);
  const titulo = `${j.veces} PJ en Huracán`;
  const url = `${URL_PAGINA_FUTBOLISTAS}?jugador=${encodeURIComponent(j.nombre)}`;
  return `
    <a class="jugador-pase${claseArquero}" href="${url}" target="_blank" rel="noopener" title="${titulo}">
      <img src="${j.foto}" alt="${nombre}" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="jugador-pase-nombre">${nombre}</span>
    </a>`;
}

function bloquePaseHTML(titulo, explicacion, jugadores) {
  if (!jugadores.length) return "";
  const { arquero, resto } = elegirOnce(jugadores);
  const equipo = arquero ? [arquero, ...resto] : resto;

  // Cada jugador va a la fila que le corresponde por su posición (no por
  // cantidad), ordenado de izquierda a derecha según la lista de esa fila.
  const ordenarSegun = orden => (a, b) =>
    orden.indexOf(a.categoria) - orden.indexOf(b.categoria) || b.veces - a.veces;
  const filaArriba = equipo.filter(j => FILA_ARRIBA_PASE.includes(j.categoria)).sort(ordenarSegun(FILA_ARRIBA_PASE));
  const filaAbajo = equipo.filter(j => !FILA_ARRIBA_PASE.includes(j.categoria)).sort(ordenarSegun(FILA_ABAJO_PASE));

  return `
    <div class="pase-bloque">
      <h4>${titulo}</h4>
      <p class="pase-explica">${explicacion}</p>
      ${filaArriba.length ? `<div class="pase-fila">${filaArriba.map(tarjetaJugadorPase).join("")}</div>` : ""}
      ${filaAbajo.length ? `<div class="pase-fila">${filaAbajo.map(tarjetaJugadorPase).join("")}</div>` : ""}
    </div>`;
}

function renderVendidosYConversos(nombreClubRival) {
  const { vendidos, conversos } = obtenerVendidosYConversos(nombreClubRival);
  if (!vendidos.length && !conversos.length) return "";

}

// Ligas en las que jugó Huracán antes de afiliarse a la AFA (Liga Centenario
// 1909, Liga 43 1910/1912, Liga Anglo-Argentina 1911): son partidos oficiales
// de esas ligas, pero NO cuentan como AFA.
function esLigaNoAfiliada(torneo) {
  const t = norm(torneo);
  return t.includes("liga centenario") || t.includes("centenario 1909") || t.includes("liga 43") || t.includes("liga anglo");
}

function calcularResumenGlobal(partidos, nombreClub, tipo) {
  let filtrados = [];

  if (tipo === "AFA") {
    filtrados = partidos.filter(p => {
      const comp = bucketCompetencia(p.Torneo);
      return comp !== "Copa Libertadores" &&
             comp !== "Copa Sudamericana" &&
             comp !== "Copa Conmebol" &&
             comp !== "No oficiales" &&
             !esLigaNoAfiliada(p.Torneo);
    });
  }

  if (tipo === "LIGAS") {
    filtrados = partidos.filter(p => esLigaNoAfiliada(p.Torneo));
  }

  if (tipo === "CONMEBOL") {
    filtrados = partidos.filter(p => {
      const comp = bucketCompetencia(p.Torneo);
      return comp === "Copa Libertadores" ||
             comp === "Copa Sudamericana" ||
             comp === "Copa Conmebol";
    });
  }

  if (tipo === "AMISTOSOS") {
    filtrados = partidos.filter(p => {
      const comp = bucketCompetencia(p.Torneo);
      return comp === "No oficiales";
    });
  }

  if (!filtrados.length) return "";

  // A
  const A = filtrados.length;

  // B y C
  const años = filtrados
    .map(p => parseInt((p.Fecha || "").split("/").pop()))
    .filter(a => !isNaN(a));

  const B = Math.min(...años);
  const C = Math.max(...años);

  // D, E, F
  let D = 0, E = 0, F = 0;

  filtrados.forEach(p => {
    const sit = cap(norm(p.Situación));
    if (sit === "Victoria") D++;
    if (sit === "Empate") E++;
    if (sit === "Derrota") F++;
  });

  // G, H
  let G = 0, H = 0;

  filtrados.forEach(p => {
    G += parseInt(p.Resultado1) || 0;
    H += parseInt(p.Resultado2) || 0;
  });

  const rival = (nombreClub || "").toUpperCase();

  // 🧠 TEXTO DINÁMICO

  // partidos (singular/plural)
  const partidosTxt = A === 1 ? "PARTIDO" : "PARTIDOS";

  // rango de años
  const rangoAnios = (B === C) ? `EN ${B}` : `ENTRE ${B} y ${C}`;

  // resultados (sin ceros)
  let partesResultados = [];
  if (D > 0) partesResultados.push(`HURACÁN GANÓ ${D}`);
  if (E > 0) partesResultados.push(`EMPATARON ${E}`);
  if (F > 0) partesResultados.push(`${rival} VENCIÓ EN ${F}`);

  let fraseResultados = "";
  if (partesResultados.length === 1) {
    fraseResultados = partesResultados[0] + ".";
  } else if (partesResultados.length === 2) {
    fraseResultados = partesResultados[0] + " y " + partesResultados[1] + ".";
  } else if (partesResultados.length === 3) {
    fraseResultados = partesResultados[0] + ", " + partesResultados[1] + " y " + partesResultados[2] + ".";
  }

  // goles (sin ceros)
  let partesGoles = [];
  if (G > 0) partesGoles.push(`EL GLOBITO ANOTÓ ${G} ${G === 1 ? "GOL" : "GOLES"}`);
  if (H > 0) partesGoles.push(`${rival} MARCÓ ${H}`);

  let fraseGoles = "";
  if (partesGoles.length === 1) {
    fraseGoles = partesGoles[0] + ".";
  } else if (partesGoles.length === 2) {
    fraseGoles = partesGoles[0] + " y " + partesGoles[1] + ".";
  }

  // encabezado distinto para amistosos
  let encabezado = "";
  if (tipo === "AFA") encabezado = "POR AFA";
  if (tipo === "CONMEBOL") encabezado = "POR CONMEBOL";
  if (tipo === "LIGAS") encabezado = "POR LIGAS NO AFILIADAS A LA AFA";
  if (tipo === "AMISTOSOS") encabezado = "";

  // frase final
  let texto = "";

  if (tipo === "AMISTOSOS") {
  const amistosoTxt = A === 1 ? "AMISTOSO" : "AMISTOSOS";
  texto = `JUGARON ${A} ${partidosTxt} ${amistosoTxt} ${rangoAnios}.`;
}
  else {
    texto = `${encabezado} JUGARON ${A} ${partidosTxt} ${rangoAnios}.`;
  }

return `
  <p class="resumen-global" style="
    margin:6px 0;
    font-weight:600;
    font-size:13px;
    text-transform:uppercase;
    color:#666;
  ">
    ${texto}
    ${fraseResultados}
    ${fraseGoles}
  </p>
`;
}
function obtenerGoleadores(partidos, nombreClub) {
  const golesHuracan = {};      // goles propios de jugadores de Huracán
  const enContraHuracan = {};   // goles EN CONTRA que favorecieron a Huracán (los hizo un rival)
  const golesRival = {};        // goles propios de jugadores del rival
  const enContraRival = {};     // goles EN CONTRA que favorecieron al rival (los hizo alguien de Huracán)

  partidos.forEach(p => {
    const texto = p.Incidencias || "";
    if (!texto.includes("GOL")) return;

    // Separamos por el separador REAL de incidencias ("</br>"), y de ahí nos
    // quedamos solo con las líneas que tienen un gol. Si separáramos por
    // "GOL" directamente, un gol sin otro gol después arrastraría todo el
    // resto del texto (incluyendo incidencias de otros jugadores, como una
    // expulsión o lesión posterior) y podía "contaminar" el chequeo de
    // "(HUR)" con una sigla que en realidad pertenece a otro evento.
    const eventos = texto.split("</br>").filter(ev => /\bGOL\b/.test(ev));

    eventos.forEach(ev => {
      const limpio = ev.trim();

      // nombre entre "GOL" y el paréntesis
      const match = limpio.match(/GOL\s+([^(]+)\(/);
      if (!match) return;

      const nombre = match[1].trim();
      const esEnContra = /-\s*en contra\s*-/i.test(limpio);

      if (limpio.includes("(HUR)")) {
        const bucket = esEnContra ? enContraHuracan : golesHuracan;
        bucket[nombre] = (bucket[nombre] || 0) + 1;
      } else {
        const bucket = esEnContra ? enContraRival : golesRival;
        bucket[nombre] = (bucket[nombre] || 0) + 1;
      }
    });
  });

  // Junta los goles propios y los "en contra" de un mismo lado, como entradas
  // INDEPENDIENTES (aunque compartan nombre) — así un jugador que hizo goles
  // propios Y además figura con un gol en contra de otro partido (por ejemplo,
  // un homónimo de otro club) no se suman en un solo total engañoso.
  function combinarYOrdenar(golesObj, enContraObj) {
    const entradas = [];
    Object.entries(golesObj).forEach(([nombre, n]) => entradas.push({ nombre, goles: n, enContra: false }));
    Object.entries(enContraObj).forEach(([nombre, n]) => entradas.push({ nombre, goles: n, enContra: true }));
    return entradas.sort((a, b) => b.goles - a.goles).slice(0, 10);
  }

  return {
    huracan: combinarYOrdenar(golesHuracan, enContraHuracan),
    rival: combinarYOrdenar(golesRival, enContraRival)
  };
}

function escapeHTML(valor) {
  return (valor || "").toString()
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Envuelve un nombre en un link a su ficha de futbolista SOLO si existe en
// la base (Utbolists.csv, cargada en 'futbolistas'). Si no, devuelve el
// nombre tal cual (escapado), sin link. Pensado para reusar en cualquier
// lugar del sitio donde aparezca un nombre de jugador: goleadores,
// transferencias, incidencias, etc.
function linkJugadorSiExiste(nombre) {
  const nombreSeguro = escapeHTML(nombre);
  if (!nombre) return nombreSeguro;
  const existe = typeof futbolistas !== "undefined" &&
    futbolistas.some(f => norm(f.futbolista) === norm(nombre));
  if (!existe) return nombreSeguro;
  const url = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(nombre)}`;
  return `<a href="${url}" target="_blank" rel="noopener" ` +
         `style="color:#d40000; text-decoration:none;" ` +
         `onmouseover="this.style.fontWeight='bold'" ` +
         `onmouseout="this.style.fontWeight='normal'">${nombreSeguro}</a>`;
}

// Igual que la anterior, pero para árbitros -> indexrbits.html
function linkArbitroSiExiste(nombre) {
  const nombreSeguro = escapeHTML(nombre);
  if (!nombre) return nombreSeguro;
  const existe = typeof arbitros !== "undefined" &&
    arbitros.some(a => norm(a.nombre) === norm(nombre));
  if (!existe) return nombreSeguro;
  const url = `https://globopedia.github.io/Artids/indexrbits.html?arbitro=${encodeURIComponent(nombre)}`;
  return `<a href="${url}" target="_blank" rel="noopener" ` +
         `style="color:#d40000; text-decoration:none;" ` +
         `onmouseover="this.style.fontWeight='bold'" ` +
         `onmouseout="this.style.fontWeight='normal'">${nombreSeguro}</a>`;
}

function buscarFichaJugador(nombreJugador) {
  // Coincidencia EXACTA de nombre normalizado, nada más. Un match parcial
  // (por ejemplo "Alarcón" contra "Williams Alarcón", o "Rami" contra
  // "Ramírez") empareja personas distintas — mejor no encontrar nada que
  // encontrar mal.
  const jugadorNorm = norm(nombreJugador);
  return transfers.find(t => norm(t.jugador) === jugadorNorm) || null;
}

function renderGoleadoresHuracan(goleadores) {
  if (!goleadores.length) return "<li>Sin goles registrados</li>";

  return goleadores.map((g, index) => {
    const { nombre, goles, enContra } = g;

// ============================================================
// === "Rachas y campañas": estadísticas de racha/sequía frente a este rival
// ============================================================
// Resultado del partido ("Victoria" / "Empate" / "Derrota", o null si no se
// sabe). Manda la columna Situación (así un partido ganado por penales sigue
// contando como victoria aunque el marcador diga 1-1), tolerando errores de
// tipeo como "derota" o "vitoria". Si la Situación no se entiende ("-",
// "desconocido"...), se deduce del marcador; si tampoco hay marcador, null.
function resultadoPartido(p) {
  const s = norm(p.Situación);
  if (/^(victoria|vitoria|vicctoria|vctoria|victora)$/.test(s)) return "Victoria";
  if (/^(derrota|derota|derrrota)$/.test(s)) return "Derrota";
  if (/^(empate|empte)$/.test(s)) return "Empate";
  const r1 = (p.Resultado1 || "").trim(), r2 = (p.Resultado2 || "").trim();
  if (!/^\d+$/.test(r1) || !/^\d+$/.test(r2)) return null;
  const g1 = parseInt(r1), g2 = parseInt(r2);
  return g1 > g2 ? "Victoria" : g1 < g2 ? "Derrota" : "Empate";
}
function esVictoria(p) { return resultadoPartido(p) === "Victoria"; }
function esEmpate(p) { return resultadoPartido(p) === "Empate"; }
function esDerrota(p) { return resultadoPartido(p) === "Derrota"; }
function esInvicto(p) { return esVictoria(p) || esEmpate(p); }
function esSinGanar(p) { return esEmpate(p) || esDerrota(p); }
function noRecibioGoles(p) { return (parseInt(p.Resultado2) || 0) === 0; }
function noMarco(p) { return (parseInt(p.Resultado1) || 0) === 0; }

// Cuenta cuántos partidos consecutivos (contando desde el más reciente hacia
// atrás, en un array ordenado ascendente por fecha) cumplen el predicado.
function calcularRachaConsecutiva(partidosAsc, predicado) {
  let count = 0;
  for (let i = partidosAsc.length - 1; i >= 0; i--) {
    if (predicado(partidosAsc[i])) count++;
    else break;
  }
  return count;
}
// Devuelve el partido que CORTÓ la racha actual, o sea el inmediatamente
// anterior a su comienzo (la última derrota, para "no pierde desde"; la
// última victoria, para "no le gana desde"). null si la racha abarca todo.
function partidoAnteriorARacha(partidosAsc, predicado) {
  const n = calcularRachaConsecutiva(partidosAsc, predicado);
  const idx = partidosAsc.length - n - 1;
  return idx >= 0 ? partidosAsc[idx] : null;
}

// Antepone el artículo que corresponde al nombre del torneo, para que la
// frase quede bien: "LA 11° FECHA...", "EL 8VO DE FINAL...", "LOS 16VOS...".
function torneoConArticulo(torneo) {
  const t = (torneo || "").trim().replace(/\s+/g, " ");
  if (!t) return "";
  const palabras = t.split(" ");
  const p0 = norm(palabras[0]);
  const p1 = norm(palabras[1] || "");
  let articulo = "la";
  if (/^\d+°$/.test(p0)) {
    // "11° fecha", "2° fase", "1° ronda"... son femeninos; "8° de final",
    // "1° desempate", "6° Apertura" son masculinos.
    articulo = /^(fecha|fase|ronda|rueda|eliminatoria|final)$/.test(p1) ? "la" : "el";
  } else if (/^\d+(vos|avos)$/.test(p0) || /^(octavos|cuartos)$/.test(p0)) {
    articulo = "los";
  } else if (/^\d+(vo|to|avo)$/.test(p0) ||
             /^(octavo|cuarto|tercer|triangular|cuadrangular|campeonato|torneo|reducido|repechaje|desempate|partido)$/.test(p0)) {
    articulo = "el";
  }
  return `${articulo} ${t}`;
}
// "de" + "el" = "del"; "en" + "el" queda igual.
function deTorneo(torneo) {
  const conArt = torneoConArticulo(torneo);
  return conArt.startsWith("el ") ? "del " + conArt.slice(3) : "de " + conArt;
}

// Arma el bloque de texto de rachas para un subconjunto de partidos ya
// filtrado (general / de local / de visitante). Cualquier número que dé 0
// o 1 se considera "exiguo" y esa línea (o esa cláusula puntual, en el caso
// de ganó/empató/perdió) se omite directamente.
function armarBloqueRachas(nombreClub, partidosSubset) {
  // Los partidos sin resultado conocido no cuentan ni cortan rachas.
  partidosSubset = partidosSubset.filter(p => resultadoPartido(p) !== null);
  if (!partidosSubset.length) return "";

  const nombreRivalUpper = escapeHTML(nombreClub).toUpperCase();
  const ultimos10 = partidosSubset.slice(-10);
  let a = 0, b = 0, c = 0;
  ultimos10.forEach(p => {
    const sit = resultadoPartido(p);
    if (sit === "Victoria") a++;
    else if (sit === "Empate") b++;
    else if (sit === "Derrota") c++;
  });

  const lineas = [];

  const partesResultado = [];
  if (a >= 2) partesResultado.push(`GANÓ ${a}`);
  if (b >= 2) partesResultado.push(`EMPATÓ ${b}`);
  if (c >= 2) partesResultado.push(`PERDIÓ ${c}`);
  if (partesResultado.length) {
    const frase = partesResultado.length === 1 ? partesResultado[0]
      : partesResultado.length === 2 ? partesResultado.join(" Y ")
      : `${partesResultado[0]}, ${partesResultado[1]} Y ${partesResultado[2]}`;
    lineas.push(`DE LOS ÚLTIMOS ${ultimos10.length} PARTIDOS OFICIALES ANTE ${nombreRivalUpper}, HURACÁN ${frase}.`);
  }

  const totalVictorias = partidosSubset.filter(esVictoria).length;
  const totalDerrotas = partidosSubset.filter(esDerrota).length;

  const d = calcularRachaConsecutiva(partidosSubset, esVictoria);
  if (d >= 2) lineas.push(`LLEVA ANTE ${nombreRivalUpper} UNA RACHA GANADORA DE ${d} PARTIDOS CONSECUTIVOS.`);

  const e = calcularRachaConsecutiva(partidosSubset, esInvicto);
  if (e >= 2) {
    const ultimaDerrota = partidoAnteriorARacha(partidosSubset, esInvicto);
    if (ultimaDerrota) {
      lineas.push(`ARRASTRA ${e} PARTIDOS SIN PERDER, PUES NO CAE DESDE ${torneoConArticulo(ultimaDerrota.Torneo)}.`);
    } else {
      // Nunca perdió en todo el historial registrado: no hay "desde cuándo"
      // que mencionar, sería inventar una referencia que no existió.
      lineas.push(`ARRASTRA ${e} PARTIDOS SIN PERDER.`);
    }
  }

  const f = calcularRachaConsecutiva(partidosSubset, esDerrota);
  if (f >= 2) lineas.push(`POSEE ANTE ${nombreRivalUpper} UNA RACHA SIN SACAR PUNTOS DE ${f} PARTIDOS CONSECUTIVOS.`);

  const g = calcularRachaConsecutiva(partidosSubset, esSinGanar);
  if (g >= 2) {
    const ultimaVictoria = partidoAnteriorARacha(partidosSubset, esSinGanar);
    if (ultimaVictoria) {
      lineas.push(`ARRASTRA UNA SEQUÍA DE ${g} PARTIDOS SIN GANARLE, PUES NO LO HACE DESDE ${torneoConArticulo(ultimaVictoria.Torneo)}.`);
    } else {
      // Nunca ganó en todo el historial registrado: mismo caso, sin "desde cuándo".
      lineas.push(`ARRASTRA UNA SEQUÍA DE ${g} PARTIDOS SIN GANARLE.`);
    }
  }

  const h = calcularRachaConsecutiva(partidosSubset, noRecibioGoles);
  const i = calcularRachaConsecutiva(partidosSubset, noMarco);
  const partesGoles = [];
  if (h >= 2) partesGoles.push(`${h} PARTIDOS SIN RECIBIR GOLES`);
  if (i >= 2) partesGoles.push(`${i} ENCUENTROS SIN MARCAR`);
  if (partesGoles.length) lineas.push(`LLEVA ${partesGoles.join(" Y ")}.`);

  let fraseMejor = "";
  if (totalVictorias > 0) {
    const ganados = partidosSubset.filter(esVictoria);
    const mejor = ganados.reduce((mx, p) => {
      if (!mx) return p;
      const dif = (parseInt(p.Resultado1) || 0) - (parseInt(p.Resultado2) || 0);
      const difMx = (parseInt(mx.Resultado1) || 0) - (parseInt(mx.Resultado2) || 0);
      if (dif > difMx) return p;
      // Empate en diferencia de gol: gana el que tenga más goles a favor
      // (2-1 "pesa" más que 1-0, aunque la diferencia sea la misma).
      if (dif === difMx && (parseInt(p.Resultado1) || 0) > (parseInt(mx.Resultado1) || 0)) return p;
      return mx;
    }, null);
    if (mejor) fraseMejor = `LA MAYOR GOLEADA DE HURACÁN FUE EL ${mejor.Resultado1}-${mejor.Resultado2} EN ${torneoConArticulo(mejor.Torneo)}`;
  }

  let frasePeor = "";
  if (totalDerrotas > 0) {
    const perdidos = partidosSubset.filter(esDerrota);
    const peor = perdidos.reduce((mx, p) => {
      if (!mx) return p;
      const dif = (parseInt(p.Resultado2) || 0) - (parseInt(p.Resultado1) || 0);
      const difMx = (parseInt(mx.Resultado2) || 0) - (parseInt(mx.Resultado1) || 0);
      if (dif > difMx) return p;
      if (dif === difMx && (parseInt(p.Resultado2) || 0) > (parseInt(mx.Resultado2) || 0)) return p;
      return mx;
    }, null);
    if (peor) frasePeor = `LA MAYOR GOLEADA DE ${nombreRivalUpper} FUE EL ${peor.Resultado2}-${peor.Resultado1} ${deTorneo(peor.Torneo)}`;
  }

  if (fraseMejor && frasePeor) {
    lineas.push(`${fraseMejor}, MIENTRAS QUE ${frasePeor}.`);
  } else if (fraseMejor) {
    lineas.push(`${fraseMejor}.`);
  } else if (frasePeor) {
    lineas.push(`${frasePeor}.`);
  }

  if (totalVictorias === 0 && partidosSubset.length >= 2) {
    lineas.push(`HURACÁN NO LE GANA A ${nombreRivalUpper}.`);
  }

  return lineas.map(l => l.toUpperCase()).join("<br>");
}

function enlazarJugadores(texto) {
  if (!texto) return "";

  // Separamos por comas, punto y coma, paréntesis, puntos y conjunciones "y" / "e".
  // OJO: el conector es SIEMPRE minúscula ("y"/"e") — si fuera insensible a
  // mayúsculas, una inicial de nombre como "Juan E Strak" se interpretaría
  // como "Juan" + conector "E" + "Strak", partiendo el nombre en dos.
  const partes = texto.split(/(\s*[,;().]+\s*(?!\b[ye]\b\s)|\s+\b[ye]\b\s+)/);

  return partes.map(part => {
    // Si la parte es un separador o signo de puntuación, la devolvemos tal cual
    if (/^(\s*[,;().]+\s*|\s+\b[ye]\b\s+)$/.test(part)) {
      return part;
    }

    const original = part.trim();
    if (!original) return part;

    // Si hay un minuto de cambio al inicio (ej: "67 ", "67' ", "45+2 "), lo extraemos
    const matchMinuto = original.match(/^(\d+(?:\+\d+)?'?\s*)(.*)/);
    let prefijoMinuto = "";
    let candidatoNombre = original;

    if (matchMinuto) {
      prefijoMinuto = matchMinuto[1];
      candidatoNombre = matchMinuto[2];
    }

    const nombreLimpio = candidatoNombre.trim();
    if (!nombreLimpio) return part;

    // Verificamos si el futbolista existe en el listado cargado (array 'futbolistas')
    const existeEnBase = typeof futbolistas !== "undefined" &&
      futbolistas.some(f => norm(f.futbolista) === norm(nombreLimpio));

    // Si existe, armamos el enlace en rojo, dejando el número del minuto afuera del link
    if (existeEnBase) {
      const url = `https://globopedia.github.io/Artids/indexutbolists.html?jugador=${encodeURIComponent(nombreLimpio)}`;
      const linkHTML = `<a href="${url}" ` +
                       `style="color: #d40000; text-decoration: none; font-weight: normal;" ` +
                       `onmouseover="this.style.fontWeight='bold'" ` +
                       `onmouseout="this.style.fontWeight='normal'">${candidatoNombre}</a>`;
      return prefijoMinuto + linkHTML;
    }

    // Si no está en la base, queda como texto plano
    return part;
  }).join("");
}

    // Busca patrones "TAG Nombre (" dentro de Incidencias (goles, expulsiones,
    // atajadas, etc.) y envuelve el nombre en el mismo link rojo de siempre,
    // SOLO si ese nombre existe en la base de futbolistas de Huracán.
    function linkearNombresEnIncidencia(texto) {
      if (typeof futbolistas === "undefined") return texto;
      return texto.replace(/\b(GOL|EXP|LES|REG|ATA|DES|POS)\b(\s+)([^(]+?)(\s*\()/g, (match, tag, espacio, nombre, apertura) => {
        const nombreLimpio = nombre.trim();
        if (!nombreLimpio) return match;
        const existe = futbolistas.some(f => norm(f.futbolista) === norm(nombreLimpio));
        if (!existe) return match;
        return `${tag}${espacio}${linkJugadorSiExiste(nombreLimpio)}${apertura}`;
      });
    }

        .replace(/EXP/g, "<img src='https://globopedia.github.io/Artids/Íconos/Roja.png' alt='expulsión' style='width:20px;height:20px;'>")
        .replace(/LES/g, "<img src='https://globopedia.github.io/Artids/Íconos/Lesionado.png' alt='lesión' style='width:20px;height:20px;'>")
        .replace(/\bREG\b/g, "<span title='regreso' style='font-size:17px;'>↩️</span>")

function debounce(func, delay) {
  return function(...args) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => func.apply(this, args), delay);
  };
}

clubSearchInput.addEventListener("keydown", function(e) {
  const suggestionsList = document.getElementById("clubAutocompleteList");
  const items = suggestionsList.querySelectorAll("li");
  if (!items.length) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    selectedIndex = (selectedIndex + 1) % items.length;
    actualizarSeleccion(items);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
    actualizarSeleccion(items);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (selectedIndex >= 0 && selectedIndex < items.length) {
      items[selectedIndex].click();
    }
  } else {
    selectedIndex = -1;
  }
});
function actualizarSeleccion(items) {
  const suggestionsList = document.getElementById("clubAutocompleteList");

  items.forEach((item, i) => {
    const activo = i === selectedIndex;
    item.classList.toggle("activo", activo);
  });

  const selectedItem = items[selectedIndex];
  if (selectedItem) {
    const containerTop = suggestionsList.scrollTop;
    const containerBottom = containerTop + suggestionsList.offsetHeight;
    const itemTop = selectedItem.offsetTop;
    const itemBottom = itemTop + selectedItem.offsetHeight;

    if (itemTop < containerTop) {
      suggestionsList.scrollTop = itemTop;
    } else if (itemBottom > containerBottom) {
      suggestionsList.scrollTop = itemBottom - suggestionsList.offsetHeight;
    }
  }
}

function obtenerPeriodosJugador(nombreJugador) {
  try {
    const partidosJugador = encuentros.filter(p =>
      p.Huracán && p.Huracán.toLowerCase().includes(nombreJugador.toLowerCase())
    );

    if (!partidosJugador.length) return [];

    // Ordenamos por fecha
    const partidosOrdenados = partidosJugador
      .map(p => ({
        ...p,
        fechaObj: parseFecha(p.Fecha)
      }))
      .filter(p => p.fechaObj instanceof Date && !isNaN(p.fechaObj))
      .sort((a, b) => a.fechaObj - b.fechaObj);

    const periodos = [];
    let inicio = partidosOrdenados[0].fechaObj;
    let anterior = inicio;

    for (let i = 1; i < partidosOrdenados.length; i++) {
      const actual = partidosOrdenados[i].fechaObj;

      // Si hay un salto grande (más de 11 meses sin jugar, o sea más de una
      // temporada entera saltada), cortamos etapa. Antes el corte era en 6
      // meses, pero eso confundía un simple receso de fin de temporada
      // (marzo a septiembre, por ejemplo) con una ida y vuelta real del
      // jugador, fragmentando su carrera en decenas de "etapas" falsas.
      const diffMeses = (actual - anterior) / (1000 * 60 * 60 * 24 * 30);

      if (diffMeses > 11) {
        periodos.push({
          primera: inicio,
          ultima: anterior
        });
        inicio = actual;
      }

      anterior = actual;
    }

    // último período
    periodos.push({
      primera: inicio,
      ultima: anterior
    });

    return periodos;

  } catch (err) {
    console.error("Error en obtenerPeriodosJugador:", nombreJugador, err);
    return [];
  }
}
function dibujarTorta(ganados, empatados, perdidos) {
  const canvas = document.getElementById("graficoResumen");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  const total = ganados + empatados + perdidos;
  if (total === 0) return;

  const cx = 60;
  const cy = 60;
  const rBase = 50;

  datosGlobal = [
  { value: ganados, color: "#FF0000", label: `${ganados} ${plural(ganados, "victoria", "victorias")}` },
  { value: empatados, color: "#cccccc", label: `${empatados} ${plural(empatados, "empate", "empates")}` },
  { value: perdidos, color: "#FFFFFF", label: `${perdidos} ${plural(perdidos, "derrota", "derrotas")}` }
  ];

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let start = 0;
    slicesGlobal = [];

    datosGlobal.forEach((d, i) => {
      if (d.value === 0) return;

      const slice = (d.value / total) * 2 * Math.PI;

      // 👇 si está en hover, agrandamos radio
      const r = (i === hoverIndex) ? rBase + 6 : rBase;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + slice);
      ctx.closePath();

      ctx.fillStyle = d.color;
      ctx.fill();

      slicesGlobal.push({
        start: start,
        end: start + slice,
        index: i,
        label: d.label
      });

      start += slice;
    });

// 🖤 borde adaptado (evita superposición)
let startBorder = 0;

datosGlobal.forEach((d, i) => {
  if (d.value === 0) return;

  const slice = (d.value / total) * 2 * Math.PI;
  const r = (i === hoverIndex) ? rBase + 6 : rBase;

  ctx.beginPath();
  ctx.arc(cx, cy, r, startBorder, startBorder + slice);
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.stroke();

  startBorder += slice;
});

    // agujero
    ctx.beginPath();
    ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
    ctx.fillStyle = "#fff";
    ctx.fill();

    // escudo
    const img = new Image();
    img.src = "https://globopedia.github.io/Artids/escudos/Huracán.png";
    img.onload = () => {
      ctx.drawImage(img, cx - 10, cy - 16, 20, 32);
    };
  }

  draw();

  // 👇 EVENTO HOVER (ahora redibuja)
  canvas.onmousemove = function(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const dx = x - cx;
    const dy = y - cy;
    const distancia = Math.sqrt(dx * dx + dy * dy);

    if (distancia > rBase) {
      hoverIndex = -1;
      canvas.title = "";
      draw();
      return;
    }

    let angulo = Math.atan2(dy, dx);
    if (angulo < 0) angulo += 2 * Math.PI;

    for (let s of slicesGlobal) {
      if (angulo >= s.start && angulo <= s.end) {
        hoverIndex = s.index;
        canvas.title = s.label;
        draw();
        return;
      }
    }
    hoverIndex = -1;
    canvas.title = "";
    draw();
  };
  canvas.onmouseleave = function() {
    hoverIndex = -1;
    canvas.title = "";
    draw();
  };
}

// ============================================================
// === Sonidos sutiles de interacción (hover en links, click en acordeón)
// ============================================================
// Generados por código con Web Audio API (nada de archivos de audio que
// cargar). OJO: los navegadores bloquean el audio hasta la primera
// interacción real del usuario (política anti-autoplay) — así que el
// primerísimo hover, antes de cualquier click, puede no sonar; a partir
// del primer click en cualquier parte de la página, ya queda desbloqueado.
let audioCtxSonidos = null;
function getAudioCtxSonidos() {
  if (!audioCtxSonidos) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    audioCtxSonidos = new AudioCtx();
  }
  if (audioCtxSonidos.state === "suspended") audioCtxSonidos.resume();
  return audioCtxSonidos;
}

function reproducirTono(frecuencia, duracionMs, volumen) {
  try {
    const ctx = getAudioCtxSonidos();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = frecuencia;
    gain.gain.value = volumen;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const fin = ctx.currentTime + duracionMs / 1000;
    gain.gain.exponentialRampToValueAtTime(0.0001, fin);
    osc.start();
    osc.stop(fin);
  } catch (e) {
    // Si el navegador bloquea el audio, no rompemos nada: quedamos en silencio.
  }
}

});
